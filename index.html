<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timeline Keeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: chronicle workbench. Header, a stage that shows either the zoomable timeline or a month grid, then the event ledger and a detail folio side by side. */
:root{
  --bg:#e8ecf1; --surface:#f7f8fa; --raised:#ffffff; --ink:#1b2130; --muted:#5a6375; --line:#cdd4de; --grid:#e2e6ec; --axis:#6d7586;
  --accent:#3647a8; --accent-ink:#ffffff; --accent-soft:#dde2f6; --danger:#b3261e; --warn-bg:#fff1d0; --warn-ink:#6b4a00;
  --secret:#8a4b08; --secret-soft:#fbe9d0;
  --band-op:.11; --shadow:0 12px 32px rgba(20,28,48,.20);
  --f-display:"Alegreya SC","Palatino Linotype",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1219; --surface:#161a23; --raised:#1d2230; --ink:#e4e7ee; --muted:#98a1b3; --line:#2b3240; --grid:#1f2532; --axis:#7e879a;
    --accent:#8d9cff; --accent-ink:#10153a; --accent-soft:#252c4c; --danger:#ff8a80; --warn-bg:#3a2e12; --warn-ink:#f3d58c;
    --secret:#f0b36a; --secret-soft:#3a2a14;
    --band-op:.17; --shadow:0 12px 32px rgba(0,0,0,.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1219; --surface:#161a23; --raised:#1d2230; --ink:#e4e7ee; --muted:#98a1b3; --line:#2b3240; --grid:#1f2532; --axis:#7e879a;
  --accent:#8d9cff; --accent-ink:#10153a; --accent-soft:#252c4c; --danger:#ff8a80; --warn-bg:#3a2e12; --warn-ink:#f3d58c;
  --secret:#f0b36a; --secret-soft:#3a2a14;
  --band-op:.17; --shadow:0 12px 32px rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto auto minmax(280px,1fr) minmax(230px,38%);gap:10px;padding-inline:16px;padding-block:12px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.spacer{flex:1}
.group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);background:var(--raised);border-radius:7px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--axis)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:var(--raised)}
.btn[aria-pressed="true"]{background:var(--secret-soft);border-color:var(--secret);color:var(--secret)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg,.icon-btn svg{width:16px;height:16px;flex:none}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);background:var(--raised);border-radius:7px;cursor:pointer;padding:0}
.icon-btn:hover{border-color:var(--axis)}
.icon-btn.sm{width:28px;height:28px}
.icon-btn:disabled{opacity:.4;cursor:default}
select.world{height:34px;border:1px solid var(--line);background:var(--raised);border-radius:7px;padding:0 8px;font-weight:600;max-width:240px}

.now-chip{display:inline-flex;align-items:stretch;border:1px solid var(--accent);border-radius:7px;overflow:hidden;height:34px;background:var(--accent-soft)}
.now-chip button{border:0;background:transparent;cursor:pointer;padding:0 8px;display:grid;place-items:center}
.now-chip .now-label{padding:0 10px;display:flex;flex-direction:column;justify-content:center;line-height:1.1;text-align:left}
.now-chip .now-label span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.now-chip .now-label b{font-family:var(--f-mono);font-size:12px;font-weight:500}
.now-chip button svg{width:15px;height:15px}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:7px;padding:6px 10px;font-size:13px}
.player-banner{background:var(--secret-soft);color:var(--secret);border:1px solid var(--secret);border-radius:7px;padding:5px 10px;font-size:13px;font-weight:600}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--raised)}
.seg button{border:0;background:transparent;padding:0 10px;height:32px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button svg{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.range{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.month-label{font-family:var(--f-display);font-weight:700;font-size:17px;min-width:9ch;text-align:center}
.hint{font-size:12.5px;color:var(--muted)}

.stage{display:grid;min-height:0;min-width:0}
.stage>*{grid-area:1/1;min-height:0;min-width:0}
.tl-wrap{position:relative;overflow-x:hidden;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.tl-wrap.dragging{cursor:grabbing}
.tl-wrap.on-axis{cursor:crosshair}
.tl-wrap.on-edge,.tl-wrap.on-edge svg .ev{cursor:ew-resize}
.tl-wrap.moving,.tl-wrap.moving svg .ev{cursor:grabbing}
.tl-gutter{position:absolute;left:0;top:0;width:168px;pointer-events:none;z-index:2}
.gut-head,.gut-row{position:absolute;left:0;width:168px;pointer-events:auto;display:flex;align-items:center;gap:6px;padding:0 8px;background:color-mix(in srgb,var(--surface) 92%,transparent);border-right:1px solid var(--line)}
.gut-head{height:26px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.gut-head button{white-space:nowrap;border:0;background:transparent;cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:2px 4px;border-radius:4px}
.gut-head button:hover{color:var(--ink);background:var(--accent-soft)}
.gut-head .grow{flex:1;text-align:left}
.gut-row{height:30px;cursor:pointer;border-radius:0 6px 6px 0}
.gut-row:hover{background:var(--accent-soft)}
.gut-row.focus{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.gut-row .ev-ico{width:20px;height:20px}
.gut-row .ev-ico svg{width:12px;height:12px}
.gut-name{flex:1;min-width:0;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gut-age{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.ph-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2.4fr) 42px 28px;gap:6px;align-items:center}
@media (max-width:640px){.ph-row{grid-template-columns:minmax(0,1fr) 42px 28px}.ph-row .datef{grid-column:1/-1;grid-row:2}}
.drag-tip{position:fixed;z-index:45;pointer-events:none;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:11.5px;padding:4px 8px;border-radius:6px;white-space:nowrap;box-shadow:var(--shadow)}
.tl-ghost{position:absolute;height:26px;border-radius:6px;background:var(--accent-soft);border:2px dashed var(--accent);pointer-events:none;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;color:var(--accent);white-space:nowrap;overflow:visible}
.tl-ghost span{background:var(--raised);padding:1px 6px;border-radius:4px;border:1px solid var(--accent);transform:translateY(-24px)}
.tl-wrap svg{display:block}
.tl-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);pointer-events:none;padding:20px}
svg .grid{stroke:var(--grid);stroke-width:1}
svg .axis{stroke:var(--axis);stroke-width:3;stroke-linecap:round}
svg .tick{stroke:var(--axis);stroke-width:1.5}
svg .tickdot{fill:var(--axis)}
svg .ticklbl{fill:var(--muted);font-family:var(--f-mono);font-size:10.5px;font-variant-numeric:tabular-nums}
svg .ticklbl.major{fill:var(--ink);font-weight:500;font-size:11.5px}
svg .nowline{stroke:var(--accent);stroke-width:2;stroke-dasharray:6 5}
svg .nowpill{fill:var(--accent)}
svg .nowtxt{fill:var(--accent-ink);font-family:var(--f-mono);font-size:11px;font-weight:500}
svg .sesline{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
svg .seslbl{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
svg .sectlbl{fill:var(--muted);font-family:var(--f-body);font-size:10.5px;font-weight:700;letter-spacing:.12em}
svg .pilltxt{font-family:var(--f-body);font-size:12.5px;font-weight:500}
svg .lanetxt{font-family:var(--f-body);font-size:12px;font-weight:500}
svg .striptxt{font-family:var(--f-body);font-size:11px;font-weight:500;font-style:italic}
svg .ev{cursor:pointer}
svg .ev:hover .pill{filter:brightness(1.12)}
svg .sel-ring{fill:none;stroke:var(--ink);stroke-width:2}
svg .relline{fill:none;stroke:var(--accent);stroke-width:2}
svg .arrowhead{fill:var(--accent)}
svg .dim{opacity:.22}

.mv{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:10px}
.mv-extra{flex:none;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.mv-extra .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-right:4px}
.mv-grid{flex:none;display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mv-head{background:var(--raised);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-cell{background:var(--raised);min-height:96px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mv-cell.pad{background:var(--surface)}
.mv-cell.now{box-shadow:inset 0 0 0 2px var(--accent)}
.mv-num{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.mv-cell.now .mv-num b{color:var(--accent)}
.mv-bars{display:flex;flex-direction:column;gap:2px}
.mv-bars span{height:4px;border-radius:2px;display:block}
.mv-item{display:flex;align-items:center;gap:4px;border:0;border-radius:4px;padding:1px 6px;font-size:12px;font-weight:500;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;max-width:100%;min-width:0}
.mv-item svg{width:12px;height:12px;flex:none}
.mv-item span{overflow:hidden;text-overflow:ellipsis}
.mv-item.soft{background:transparent!important;border:1px dashed currentColor}
.mv-item[aria-current="true"]{outline:2px solid var(--ink);outline-offset:1px}
.mv-more{font-size:11.5px;color:var(--muted)}
.mv-empty{padding:30px;text-align:center;color:var(--muted)}

.panes{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px;min-height:0}
.pane{border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;min-height:0;min-width:0}
.pane-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.pane-head h2{font-family:var(--f-display);font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.search{position:relative;flex:1;min-width:160px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.search input{width:100%;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--raised);padding:0 10px 0 30px}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:center}
.filters select{height:26px;border:1px solid var(--line);border-radius:13px;background:var(--raised);padding:0 8px;font-size:12.5px;max-width:170px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 8px;border-radius:13px;border:1px solid var(--line);background:var(--raised);cursor:pointer;font-size:12.5px;font-weight:500}
.chip i{width:10px;height:10px;border-radius:50%;display:block}
.chip[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
.chip.manage{border-style:dashed;color:var(--muted)}
.list{overflow:auto;min-height:0;flex:1;padding:4px}
.ev-line{display:flex;align-items:center;gap:4px}
.ev-row{flex:1;min-width:0;display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;border:0;background:transparent;border-radius:7px;padding:6px 8px;cursor:pointer}
.ev-row:hover{background:var(--accent-soft)}
.ev-row[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.ev-edit{opacity:.55;border-color:transparent;background:transparent}
.ev-line:hover .ev-edit,.ev-edit:focus-visible{opacity:1;border-color:var(--line);background:var(--raised)}
.ev-ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.ev-ico svg{width:15px;height:15px}
.ev-ico.period{border-radius:7px}
.ev-ico.life{border-radius:50% 50% 7px 7px}
.ev-main{min-width:0;display:flex;flex-direction:column}
.ev-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-date{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ev-side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:0}
.ev-cat{font-size:12px;color:var(--muted);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:0 6px;border-radius:9px;white-space:nowrap}
.badge.secret{background:var(--secret-soft);color:var(--secret)}
.badge.ses{background:var(--accent-soft);color:var(--accent)}
.list-empty{padding:24px 16px;color:var(--muted);text-align:center}

.detail{overflow:auto;min-height:0;flex:1;padding:16px 18px}
.detail .kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.detail h3{font-family:var(--f-display);font-size:24px;line-height:1.15;margin:4px 0 10px;text-wrap:balance;display:flex;gap:10px;align-items:center}
.detail h3 .ev-ico{width:34px;height:34px}
.detail h3 .ev-ico svg{width:18px;height:18px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;margin:0 0 12px;font-size:14px}
.facts dt{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding-top:2px}
.facts dd{margin:0;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.facts dd.plain{font-family:var(--f-body);font-size:14px}
.tags,.chips-inline{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;padding:1px 8px;border-radius:10px;background:var(--accent-soft)}
.link-chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:1px 8px 1px 6px;border-radius:10px;border:1px solid var(--line);background:var(--raised);cursor:pointer;max-width:100%}
.link-chip i{width:8px;height:8px;border-radius:50%;flex:none}
.link-chip small{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.link-chip:hover{border-color:var(--axis)}
.md{max-width:65ch;margin:0 0 14px;overflow-wrap:anywhere}
.md p{margin:0 0 .6em}
.md h4,.md h5,.md h6{font-family:var(--f-display);margin:.6em 0 .3em}
.md ul,.md ol{margin:0 0 .6em;padding-left:1.3em}
.md code{font-family:var(--f-mono);font-size:.88em;background:var(--accent-soft);padding:0 4px;border-radius:4px}
.md blockquote{margin:0 0 .6em;padding-left:10px;border-left:3px solid var(--line);color:var(--muted)}
.md a{color:var(--accent)}
.md.empty{color:var(--muted);font-style:italic}
.dm-notes{border:1px dashed var(--secret);background:var(--secret-soft);border-radius:8px;padding:8px 12px;margin:0 0 14px;max-width:65ch}
.dm-notes .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--secret);display:block;margin-bottom:4px}
.dm-notes .md{margin:0}
.detail-actions{display:flex;flex-wrap:wrap;gap:6px}
.detail a{color:var(--accent);overflow-wrap:anywhere}
.welcome{color:var(--muted);max-width:56ch}
.welcome h3{color:var(--ink)}
kbd{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--raised);color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;gap:18px;margin:14px 0}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--f-display);font-size:24px;color:var(--ink);line-height:1.1}
.stats span{font-size:12px;letter-spacing:.06em;text-transform:uppercase}

.overlay{position:fixed;inset:0;background:rgba(10,14,24,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--raised);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(600px,100%);max-height:calc(100% - 8px);display:flex;flex-direction:column;min-height:0}
.modal.wide{width:min(840px,100%)}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-head h2{font-family:var(--f-display);font-size:20px;margin:0;flex:1}
.modal-body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding-top:4px}
.modal-foot .left{margin-right:auto}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.field input[type=text],.field input[type=url],.field input[type=number],.field select,.field textarea,.inp{height:34px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:0 10px;width:100%;min-width:0}
.field textarea{height:auto;min-height:90px;padding:8px 10px;resize:vertical}
.inp:disabled{opacity:.4}
textarea.code{font-family:var(--f-mono);font-size:12px;min-height:80px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row>.field{flex:1 1 140px}
.datef{display:grid;grid-template-columns:64px minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);gap:6px}
.datef.noera{grid-template-columns:64px minmax(0,1.6fr) minmax(0,1fr)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent);flex:none}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px}
.icon-grid button{height:36px;border:1px solid var(--line);border-radius:7px;background:var(--surface);cursor:pointer;display:grid;place-items:center}
.icon-grid button svg{width:17px;height:17px}
.icon-grid button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.color-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
input[type=color]{width:42px;height:34px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--surface);cursor:pointer}
.pick{display:flex;flex-direction:column;gap:6px}
.pick-box{max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:var(--surface);display:flex;flex-direction:column;gap:3px}
.pick-box .check{font-size:13.5px;min-width:0}
.pick-box .check span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err{color:var(--danger);font-size:13.5px;font-weight:500;margin:0}
.help{font-size:13px;color:var(--muted);margin:0}
fieldset{border:1px solid var(--line);border-radius:9px;padding:10px 12px 12px;margin:0;min-width:0;display:flex;flex-direction:column;gap:10px}
legend{font-family:var(--f-display);font-weight:700;font-size:15px;padding:0 6px}
.tbl-wrap{overflow-x:auto}
table.ed{border-collapse:collapse;width:100%;font-size:14px}
table.ed th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:4px 4px}
table.ed td{padding:3px 4px;vertical-align:middle}
table.ed td .inp{height:30px}
table.ed td.num{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:28px}
table.ed td.act{white-space:nowrap;width:1%}
.summary,.result{font-family:var(--f-mono);font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.result b{font-size:14px;color:var(--ink)}
.img-preview{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.pop{position:fixed;z-index:40;width:min(340px,calc(100vw - 24px));background:var(--raised);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pop-head{display:flex;align-items:flex-start;gap:10px}
.pop-t{flex:1;min-width:0;display:flex;flex-direction:column}
.pop-t b{font-family:var(--f-display);font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.pop-t span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.pop-cat{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pop .md{max-height:9.5em;overflow:auto;font-size:14px;margin:0}
.pop-actions{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:60;box-shadow:var(--shadow)}

@media (max-width:820px){
  .app{height:auto;grid-template-rows:auto auto 62vh auto}
  .panes{grid-template-columns:minmax(0,1fr)}
  .list{max-height:55vh}
  .hint{display:none}
  .mv{padding:6px}
  .mv-cell{min-height:70px;padding:3px}
  .mv-head{padding:4px 3px;font-size:9.5px;letter-spacing:0}
  .mv-item{padding:1px 3px;font-size:11px}
  .mv-item svg{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

<body>

<div class="app" id="app">
  <header class="top">
    <h1 class="brand">Timeline Keeper<small>Chronicles for invented calendars</small></h1>
    <select class="world" id="world-select" aria-label="World"></select>
    <div class="now-chip" id="now-chip">
      <button id="now-prev" aria-label="Move current date back one day" title="Back one day"></button>
      <button class="now-label" id="now-open" title="Set the current date and sessions"><span id="now-kicker">Now</span><b id="now-text">Not set</b></button>
      <button id="now-next" aria-label="Move current date forward one day" title="Forward one day"></button>
    </div>
    <span class="player-banner" id="player-banner" hidden>Player view: secrets hidden</span>
    <span class="warn" id="storage-warn" hidden>This browser isn't saving. Use Data → Export to keep your work.</span>
    <div class="spacer"></div>
    <div class="group">
      <button class="icon-btn" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
      <button class="btn" id="btn-player" aria-pressed="false" title="Hide secret events and DM notes (P)"></button>
      <button class="btn" id="btn-calendar"></button>
      <button class="btn" id="btn-cats"></button>
      <button class="btn" id="btn-data"></button>
      <button class="btn primary" id="btn-add"></button>
    </div>
  </header>

  <div class="toolbar">
    <div class="seg" id="mode-seg" role="group" aria-label="View">
      <button data-mode="timeline" aria-pressed="true" id="mode-tl"></button>
      <button data-mode="month" aria-pressed="false" id="mode-mv"></button>
    </div>
    <div class="group" id="tl-controls">
      <button class="icon-btn" id="zoom-out" title="Zoom out (−)" aria-label="Zoom out"></button>
      <button class="icon-btn" id="zoom-in" title="Zoom in (+)" aria-label="Zoom in"></button>
      <button class="btn" id="zoom-fit" title="Fit all events (F)"></button>
      <button class="btn" id="btn-image" title="Save the visible timeline as an image"></button>
    </div>
    <div class="group" id="mv-controls" hidden>
      <button class="icon-btn" id="mv-prevy" title="Previous year" aria-label="Previous year"></button>
      <button class="icon-btn" id="mv-prev" title="Previous month" aria-label="Previous month"></button>
      <span class="month-label" id="mv-label"></span>
      <button class="icon-btn" id="mv-next" title="Next month" aria-label="Next month"></button>
      <button class="icon-btn" id="mv-nexty" title="Next year" aria-label="Next year"></button>
    </div>
    <button class="btn" id="zoom-now" title="Jump to the current date (.)"></button>
    <button class="btn" id="btn-calc" title="Date calculator"></button>
    <button class="btn" id="btn-bm" title="Bookmarks: Shift+1…9 saves the view, 1…9 jumps, Backspace goes back"></button>
    <span class="range" id="range"></span>
    <div class="spacer"></div>
    <span class="hint" id="hint"></span>
  </div>

  <div class="stage" id="stage">
    <div class="tl-wrap" id="tl" tabindex="0" aria-label="Timeline. Arrow keys pan, plus and minus zoom.">
      <svg id="tl-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="tl-empty" id="tl-empty" hidden>No events yet. Click the timeline axis, drag along it for a period, or press “Add event”.</div>
      <div class="tl-ghost" id="tl-ghost" hidden><span id="tl-ghost-lbl"></span></div>
      <div class="tl-gutter" id="tl-gutter"></div>
    </div>
    <div class="mv" id="mv" hidden></div>
  </div>

  <div class="panes">
    <section class="pane" aria-labelledby="list-h">
      <div class="pane-head">
        <h2 id="list-h">Events</h2>
        <span class="count" id="list-count"></span>
        <div class="search"><span id="search-ico"></span><input type="text" id="search" placeholder="Search titles, descriptions, tags, places" aria-label="Search events"></div>
        <div class="seg" id="kind-filter" role="group" aria-label="Show">
          <button data-k="all" aria-pressed="true">All</button>
          <button data-k="moment" aria-pressed="false">Moments</button>
          <button data-k="period" aria-pressed="false">Periods</button>
          <button data-k="life" aria-pressed="false">Characters</button>
        </div>
      </div>
      <div class="filters" id="filters"></div>
      <div class="list" id="list"></div>
    </section>
    <section class="pane" aria-label="Event details">
      <div class="detail" id="detail"></div>
    </section>
  </div>
</div>

<script>

const MIN_PPD = 2e-6, MAX_PPD = 160;

  now:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  tag:'<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1.5"/>',
  data:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>',
  chevL:'<path d="M15 18l-6-6 6-6"/>', chevR:'<path d="M9 18l6-6-6-6"/>',

  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>',
  eye:'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  timeline:'<path d="M3 12h18"/><circle cx="7" cy="12" r="2"/><circle cx="16" cy="12" r="2"/><path d="M7 10V5M16 14v5"/>',
  grid:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M9 10v11M15 10v11"/>',
  calc:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 18h.01M12 18h4"/>',

};
const svgI = (paths) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
const ui = n => svgI(UI[n]);
const icon = n => svgI(ICONS[n] || ICONS.dot);

function textOn(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return '#ffffff';
  const n = parseInt(m[1],16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  return (0.299*r + 0.587*g + 0.114*b)/255 > 0.62 ? '#14171f' : '#ffffff';
}

/* ---------- markdown: escape first, then a small safe subset ---------- */
function inlineMd(s){
  return s.replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(text){
  const lines=esc(text||'').split(/\r?\n/); let html='', list=null, para=[];
  const flushP=()=>{ if(para.length){ html+='<p>'+inlineMd(para.join('<br>'))+'</p>'; para=[]; } };
  const flushL=()=>{ if(list){ html+=`</${list}>`; list=null; } };
  for(const raw of lines){
    const l=raw.replace(/\s+$/,''); let m;
    if(!l.trim()){ flushP(); flushL(); continue; }
    if((m=/^(#{1,3})\s+(.*)$/.exec(l))){ flushP(); flushL(); const h=m[1].length+3; html+=`<h${h}>${inlineMd(m[2])}</h${h}>`; continue; }
    if((m=/^\s*[-*]\s+(.*)$/.exec(l))){ flushP(); if(list!=='ul'){ flushL(); html+='<ul>'; list='ul'; } html+='<li>'+inlineMd(m[1])+'</li>'; continue; }
    if((m=/^\s*\d+[.)]\s+(.*)$/.exec(l))){ flushP(); if(list!=='ol'){ flushL(); html+='<ol>'; list='ol'; } html+='<li>'+inlineMd(m[1])+'</li>'; continue; }
    if((m=/^&gt;\s?(.*)$/.exec(l))){ flushP(); flushL(); html+='<blockquote>'+inlineMd(m[1])+'</blockquote>'; continue; }
    flushL(); para.push(l);
  }
  flushP(); flushL(); return html;
}

/* ---------- calendar math ----------
   Dates are {y, m, d}: y is an absolute year (may be 0 or negative), m a 0-based month index, d 1-based.
   Absolute day 0 is the first day of year 1. */
function calBase(cal){ return cal.months.reduce((s,m)=>s+(+m.days||0),0); }
function ruleHits(r,a,b){ if(b<a || !(r.every>0)) return 0; return Math.floor((b-r.offset)/r.every) - Math.floor((a-1-r.offset)/r.every); }
function isRuleYear(r,y){ return r.every>0 && mod(y-r.offset, r.every)===0; }
function validRule(cal,r){ return r.every>0 && r.month>=0 && r.month<cal.months.length; }
function monthLen(cal,y,m){ let n=+cal.months[m].days||0; for(const r of cal.leap) if(validRule(cal,r) && r.month===m && isRuleYear(r,y)) n+= +r.days; return n; }
function yearLen(cal,y){ let n=calBase(cal); for(const r of cal.leap) if(validRule(cal,r) && isRuleYear(r,y)) n+= +r.days; return n; }
function avgYear(cal){ let n=calBase(cal); for(const r of cal.leap) if(validRule(cal,r)) n+= (+r.days)/r.every; return n>0?n:1; }
function daysBeforeYear(cal,y){
  const base=calBase(cal); let n;
  if(y>=1){ n=(y-1)*base; for(const r of cal.leap) if(validRule(cal,r)) n+=ruleHits(r,1,y-1)*r.days; }
  else { n=-(1-y)*base; for(const r of cal.leap) if(validRule(cal,r)) n-=ruleHits(r,y,0)*r.days; }
  return n;
}
function toDay(cal,dt){
  const m=clamp(dt.m|0,0,cal.months.length-1);
  let n=daysBeforeYear(cal,dt.y);
  for(let i=0;i<m;i++) n+=monthLen(cal,dt.y,i);
  const ml=monthLen(cal,dt.y,m);
  if(ml<=0) return n;
  return n + clamp(dt.d|0,1,ml) - 1;
}
function fromDay(cal,n){
  n=Math.floor(n);
  let y=Math.floor(n/avgYear(cal))+1, guard=0;
  while(daysBeforeYear(cal,y)>n && guard++<1e5) y--;
  while(daysBeforeYear(cal,y+1)<=n && guard++<1e5) y++;
  let r=n-daysBeforeYear(cal,y);
  for(let m=0;m<cal.months.length;m++){ const ml=monthLen(cal,y,m); if(r<ml) return {y,m,d:r+1}; r-=ml; }
  return {y,m:cal.months.length-1,d:1};
}
const norm = (cal,dt) => fromDay(cal,toDay(cal,dt));
function unitStart(cal,dt,p){ if(p==='year') return daysBeforeYear(cal,dt.y); if(p==='month') return toDay(cal,{y:dt.y,m:dt.m,d:1}); return toDay(cal,dt); }
function unitEnd(cal,dt,p){
  if(p==='year') return daysBeforeYear(cal,dt.y+1);
  if(p==='month') return toDay(cal,{y:dt.y,m:dt.m,d:1})+Math.max(1,monthLen(cal,dt.y,dt.m));
  return toDay(cal,dt)+1;
}
function addMonths(cal,dt,k){
  const M=cal.months.length, idx=dt.y*M+dt.m+k, y=Math.floor(idx/M), m=mod(idx,M);
  return {y,m,d:Math.min(dt.d,Math.max(1,monthLen(cal,y,m)))};
}
function addYears(cal,dt,k){ const y=dt.y+k; return {y,m:dt.m,d:Math.min(dt.d,Math.max(1,monthLen(cal,y,dt.m)))}; }
function ageAt(birth,bp,d){
  let a=d.y-birth.y;
  if(bp==='day'){ if(d.m<birth.m || (d.m===birth.m && d.d<birth.d)) a--; }
  else if(bp==='month'){ if(d.m<birth.m) a--; }
  return a;
}
function sortedEras(cal){ return [...(cal.eras||[])].filter(e=>e.name||e.abbr).sort((a,b)=>a.start-b.start); }
function hasPre(cal){ return !!(cal.preEra && (cal.preEra.name||cal.preEra.abbr)); }
function eraOf(cal,y){
  const eras=sortedEras(cal);
  for(let i=eras.length-1;i>=0;i--) if(y>=eras[i].start) return {era:eras[i], idx:i, ey:y-eras[i].start+1};
  if(eras.length && hasPre(cal)) return {era:cal.preEra, idx:'pre', ey:eras[0].start-y};
  if(eras.length) return {era:eras[0], idx:0, ey:y-eras[0].start+1};
  return {era:null, idx:-1, ey:y};

const PATCHES=[{"rev":"syreen-1","world":"kainlbwp","categories":[{"id":"c-syreen","name":"Syreen Haven","color":"#c2611f"}],"events":[{"title":"Syreen Haven","kind":"life","start":{"y":1170,"m":0,"d":1},"end":null,"prec":"year","approx":true,"cat":"c-syreen","icon":"shield","color":"","line":false,"tags":["syreen","eladrin","paladin"],"link":"","desc":"Ο θρύλος λέει ότι στο φθινοπωρινό βασίλειο του **Feywild** τα φύλλα δεν πέφτουν ποτέ ολοκληρωτικά. Απλώς αλλάζουν χρώμα, ξανά και ξανά, σαν να μη μπορούν να αποφασίσουν να αποχαιρετήσουν. Εκεί γεννήθηκε η **Syreen Haven**, η μικρότερη από επτά παιδιά μιας Autumn Eladrin οικογένειας. Είχε πέντε μεγαλύτερους αδερφούς, θορυβώδεις και ανταγωνιστικούς, και μία μεγαλύτερη αδερφή, που έγινε το πιο σταθερό της στήριγμα. Ο πατέρας τους έφυγε όταν η Syreen ήταν ακόμα μωρό και δεν τον ξαναείδε ποτέ. Τα επτά παιδιά τα μεγάλωσε μόνη της η μητέρα της, μια γυναίκα αυστηρή αλλά και η πρώτη που την κρατούσε κάθε φορά που έκλαιγε.\n\nΤο χάρισμά της φάνηκε νωρίς. Όταν κάποιος γύρω της πονούσε, ένα ζεστό, κεχριμπαρένιο φως μαζευόταν στις παλάμες της. Η μητέρα της δεν το άφησε να γίνει παιχνίδι ούτε αιτία για έπαρση, αλλά το έκανε πειθαρχία: προσευχή, άσκηση και ευθύνη. Όταν χρόνια αργότερα έδωσε το **Oath of Devotion**, δεν ένιωσε ότι κάτι καινούργιο της δόθηκε. Ένιωσε ότι έβαζε επιτέλους λόγια σε μια υπόσχεση που κρατούσε από παιδί: να προστατεύει όσους αγαπά.\n\nΗ οικογένειά της την πλήγωσε πολλές φορές, αλλά δεν έπαψε ποτέ να τους αγαπά. Είναι αισιόδοξη και βαθιά συμπονετική, αλλά όσα έζησε έχουν αφήσει σημάδια. Όπως κάθε Eladrin του φθινοπώρου, η διάθεσή της αλλάζει σαν τα φύλλα: από ζεστή τρυφερότητα σε μια ήσυχη, βαριά μελαγχολία. Εμπιστεύεται εύκολα, ίσως πολύ εύκολα, και συχνά βάζει τους άλλους πάνω από τον εαυτό της.\n\nΜια πύλη από το Feywild την οδήγησε στην **ιπτάμενη πόλη του Drift**, ένα ερειπωμένο αλλά ζωντανό νησί πάνω από τα σύννεφα, με το **Crystal Forge** να βουίζει στην καρδιά του. Για ένα διάστημα πηγαινοερχόταν. Βο   const t=backStack[backStack.length-1]; if(t && t.world===w.id && Math.abs(t.ppd-v.ppd)<1e-12 && Math.abs(t.start-v.start)<1e-6) return;
  backStack.push({world:w.id,...v}); if(backStack.length>40) backStack.shift(); }
function goBack(){
  const w=W(); let t; while((t=backStack.pop()) && t.world!==w.id){}
  if(!t){ toast('Nothing to go back to'); return; }
  if(S.mode!=='timeline'){ S.mode='timeline'; renderAll(); }
  w.view={ppd:t.ppd,start:t.start}; recenterAxis=true; saveSoon(); schedule(); toast('Back');
}
function viewLabel(w,v){
  const cal=w.calendar, W0=stageWidth(), a=fromDay(cal,v.start), b=fromDay(cal,v.start+W0/v.ppd), ppy=avgYear(cal)*v.ppd;
  return ppy>=420 ? `${fmtDate(cal,a)} – ${fmtDate(cal,b)}` : `${fmtYear(cal,a.y)} – ${fmtYear(cal,b.y)}`;
}
function centerLabel(w,v){ const cal=w.calendar; const c=fromDay(cal,v.start+stageWidth()/2/v.ppd); return avgYear(cal)*v.ppd>=420 ? `${cal.months[c.m].name} ${fmtYear(cal,c.y)}` : fmtYear(cal,c.y); }
function saveBookmark(n){
  const w=W(); ensureView();
  const old=w.bookmarks[n];
  commit(()=>{ w.bookmarks[n]={name: old&&old.name ? old.name : centerLabel(w,w.view), ppd:w.view.ppd, start:w.view.start, at:Date.now()}; });
  toast(`Bookmark ${n} ${old?'updated':'saved'}: ${w.bookmarks[n].name}. Press ${n} to return`);
}
function gotoBookmark(n){
  const w=W(), b=w.bookmarks[n];
  if(!b){ toast(`Bookmark ${n} is empty. Press Shift+${n} to save the current view`); return; }
  pushBack(); hidePop();
  if(S.mode!=='timeline'){ S.mode='timeline'; renderAll(); }
  w.view={ppd:b.ppd,start:b.start}; recenterAxis=true; saveSoon(); schedule();

}
function openBookmarks(){
  const w=W(); ensureView();
  const ov=openModal('Bookmarks','',false); const body=$('.modal-body',ov);

    body.innerHTML=`<p class="help">A bookmark remembers a place and zoom on the timeline. <kbd>Shift</kbd>+<kbd>1</kbd>…<kbd>9</kbd> saves the current view, <kbd>1</kbd>…<kbd>9</kbd> jumps to it and <kbd>Backspace</kbd> goes back.</p>
      <div class="tbl-wrap"><table class="ed"><thead><tr><th>Key</th><th>Name</th><th>Shows</th><th></th></tr></thead><tbody>
      ${[1,2,3,4,5,6,7,8,9].map(n=>{ const b=w.bookmarks[n];
        return `<tr data-bm="${n}"><td class="num"><kbd>${n}</kbd></td>

          <td style="font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap">${b?esc(viewLabel(w,b)):''}</td>
          <td class="act">${b?`<button class="btn" data-act="go">Go</button> `:''}<button class="btn" data-act="set" title="Save the current view in this slot">${b?'Replace':'Save current view'}</button>${b?` <button class="icon-btn sm" data-act="del" aria-label="Remove bookmark ${n}">${ui('x')}</button>`:''}</td></tr>`; }).join('')}
      </tbody></table></div>
      <div class="modal-foot"><button class="btn primary" data-close2>Done</button></div>`;
  };
  paint();
  body.addEventListener('change',e=>{ const r=e.target.closest('[data-bm]'); if(!r||e.target.dataset.f!=='name') return; const n=r.dataset.bm, v=e.target.value.trim(); if(!v) return; commit(()=>{ w.bookmarks[n].name=v; }); });

function zoomAt(factor,px){
  const v=W().view; const d=v.start+px/v.ppd;
  v.ppd=clamp(v.ppd*factor,MIN_PPD,MAX_PPD); v.start=d-px/v.ppd; saveSoon(); schedule();
}
function computeTicks(cal,start,end,ppd){
  const out=[]; const ppy=avgYear(cal)*ppd;
  if(ppd>=26){
    for(let n=Math.floor(start);n<=Math.ceil(end);n++){ const dt=fromDay(cal,n); const major=dt.d===1;
      out.push({day:n, major, center:true, label: major ? `${cal.months[dt.m].name} ${fmtYear(cal,dt.y)}` : String(dt.d)}); }
    return out;
  }
  if(ppy>=420){
    const y0=fromDay(cal,start).y, y1=fromDay(cal,end).y;
    for(let y=y0;y<=y1;y++){ let n=daysBeforeYear(cal,y);
      for(let m=0;m<cal.months.length;m++){ const ml=monthLen(cal,y,m); if(ml<=0) continue;
        const name=m===0?fmtYear(cal,y):cal.months[m].name;
        out.push({day:n, major:m===0, label:(m===0 || ml*ppd>=tw(name,TICK_FONT)+12)?name:''}); n+=ml; } }
    return out;
  }
  const steps=[1,2,5,10,20,25,50,100,200,250,500,1000,2000,2500,5000,10000,20000,25000,50000,100000,200000,250000,500000,1000000];
  const step=steps.find(s=>s*ppy>=84)||steps[steps.length-1];
  const minor=step===1?1:(step%5===0?step/5:step/2);
  const ys=fromDay(cal,start).y-step, ye=fromDay(cal,end).y+step;
  for(let y=Math.floor(ys/minor)*minor; y<=ye; y+=minor){ const major=mod(y,step)===0; out.push({day:daysBeforeYear(cal,y), major, label:major?fmtYear(cal,y):''}); }
  if(step===1 && ppy>=150){
    for(let y=ys;y<=ye;y++){ let n=daysBeforeYear(cal,y); for(let m=0;m<cal.months.length;m++){ const ml=monthLen(cal,y,m); if(m>0 && ml>0) out.push({day:n,major:false,label:''}); n+=ml; } }
  }
  return out;
}

function renderTimeline(){

function renderMonth(){
  const w=W(), cal=w.calendar, {y,m}=monthCursor();
  const ml=monthLen(cal,y,m), mon=cal.months[m];

  $('#range').textContent=`${ml} day${ml===1?'':'s'}`;
  if(ml<=0){ mv.innerHTML=`<div class="mv-empty">${esc(mon.name)} has no days in ${esc(fmtYear(cal,y))}. It only appears in leap years.</div>`; return; }

  const offset=nWd?mod(first+(+cal.epochWeekday||0),nWd):0;

$('#world-select').addEventListener('change',e=>{
  if(e.target.value==='__new'){ e.target.value=S.activeId; openNewWorldModal(); return; }
  S.activeId=e.target.value; recenterAxis=true; ui$.selected=null; ui$.focusChar=null; ui$.month=null; ui$.loc=''; ui$.ses=''; saveSoon(); renderAll();
});
function stepNow(n){ const w=W(); if(!w.now) return; commit(()=>{ w.now=fromDay(w.calendar,toDay(w.calendar,w.now)+n); }); }
function togglePlayer(){ S.playerView=!S.playerView; const e=ui$.selected&&byId(W(),ui$.selected); if(e&&e.secret&&S.playerView) ui$.selected=null; hidePop(); saveSoon(); renderAll(); toast(S.playerView?'Player view: secrets hidden':'DM view: everything visible'); }

/* ---------- list & filters ---------- */
function renderFilters(){
  const w=W();
  const locs=[...new Set(w.events.filter(e=>visibleEv(w,e)).map(e=>e.location.trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const sess=[...new Set(w.events.filter(e=>visibleEv(w,e)).map(e=>e.session.trim()).filter(Boolean))].sort((a,b)=>(+a-+b)||a.localeCompare(b));
  if(ui$.loc && !locs.includes(ui$.loc)) ui$.loc='';
  if(ui$.ses && !sess.includes(ui$.ses)) ui$.ses='';
  const hasUncat=w.events.some(e=>!catOf(w,e.cat)), hiddenN=w.categories.filter(c=>c.hidden).length+(hasUncat&&w.hideUncat?1:0), solo=(w.hideUncat||!hasUncat) && w.categories.filter(c=>!c.hidden).length===1 ? w.categories.find(c=>!c.hidden) : null;
  $('#filters').innerHTML=
    `<select id="f-only" aria-label="Show only one category"><option value="">Show only…</option>${w.categories.map(c=>`<option value="${c.id}"${solo&&solo.id===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select>`+
    (hiddenN?`<button class="chip" id="chip-all" title="Show every category again">Show all</button>`:'')+
    w.categories.map(c=>`<button class="chip" data-cat="${c.id}" aria-pressed="${!c.hidden}" title="Click to show or hide · double-click to show only this">${'<i style="background:'+c.color+'"></i>'}${esc(c.name)}</button>`).join('')+
    (hasUncat?`<button class="chip" data-cat="__none" aria-pressed="${!w.hideUncat}" title="Events without a category"><i style="background:var(--muted)"></i>No category</button>`:'')+
    `<button class="chip manage" id="chip-manage">Edit categories</button>`+
    (locs.length?`<select id="f-loc" aria-label="Filter by location"><option value="">All locations</option>${locs.map(l=>`<option value="${esc(l)}"${l===ui$.loc?' selected':''}>${esc(l)}</option>`).join('')}</select>`:'')+
    (sess.length?`<select id="f-ses" aria-label="Filter by session"><option value="">All sessions</option>${sess.map(s=>`<option value="${esc(s)}"${s===ui$.ses?' selected':''}>Session ${esc(s)}</option>`).join('')}</select>`:'');
}
$('#filters').addEventListener('click',e=>{
  if(e.target.closest('#chip-manage')){ openCategories(); return; }
  if(e.target.closest('#chip-all')){ showOnlyCat(null); return; }
  const b=e.target.closest('[data-cat]'); if(!b) return;
  /* a second click within a moment means "show only this one" */
  const id=b.dataset.cat;
  if(chipTimer && chipTimer.id===id){ clearTimeout(chipTimer.t); chipTimer=null; if(id!=='__none') showOnlyCat(id); return; }
  if(chipTimer) clearTimeout(chipTimer.t);
  chipTimer={id,t:setTimeout(()=>{ chipTimer=null; const w=W(); if(id==='__none') w.hideUncat=!w.hideUncat; else { const c=catOf(w,id); c.hidden=!c.hidden; } saveSoon(); renderAll(); },230)};
});
/* show a single category (or all of them when id is null) on the timeline, month view and list */
function showOnlyCat(id){ const w=W(); w.categories.forEach(c=>{ c.hidden = id ? c.id!==id : false; }); w.hideUncat=!!id; hidePop(); saveSoon(); renderAll();
  if(id) toast('Showing only '+catOf(w,id).name+'. Use “Show all” to bring the rest back'); }
let chipTimer=null;
$('#filters').addEventListener('change',e=>{ if(e.target.id==='f-only'){ showOnlyCat(e.target.value||null); return; } if(e.target.id==='f-loc') ui$.loc=e.target.value; if(e.target.id==='f-ses') ui$.ses=e.target.value; renderList(); });
function filteredSorted(){
  const w=W(), q=ui$.query.trim();
  return w.events.filter(e=>visibleEv(w,e) && (ui$.kind==='all'||e.kind===ui$.kind) && matches(w,e,q)
      && (!ui$.loc || e.location.trim()===ui$.loc) && (!ui$.ses || e.session.trim()===ui$.ses))
    .sort((a,b)=>evStart(w,a)-evStart(w,b) || a.title.localeCompare(b.title));
}
function renderList(){
  const w=W(), list=filteredSorted();
  $('#list-count').textContent = `${list.length} of ${w.events.filter(e=>visibleEv(w,e)).length}`;
  if(!list.length){ $('#list').innerHTML=`<div class="list-empty">${w.events.length?'No events match the search or filters.':'No events yet. Add one with “Add event”.'}</div>`; return; }
  $('#list').innerHTML=list.map(e=>{ const c=evColor(w,e), cat=catOf(w,e.cat);
    const badges=(e.secret?'<span class="badge secret">Secret</span>':'')+(e.session?`<span class="badge ses">S${esc(e.session)}</span>`:'');
    return `<div class="ev-line"><button class="ev-row" data-id="${e.id}" aria-current="${ui$.selected===e.id}"><span class="ev-ico ${e.kind}" style="background:${c};color:${textOn(c)}">${icon(e.icon)}</span><span class="ev-main"><span class="ev-title">${esc(e.title)}</span><span class="ev-date">${esc(fmtEvDate(w,e))}${e.location?' · '+esc(e.location):''}</span></span><span class="ev-side"><span class="ev-cat">${esc(cat?cat.name:'')}</span>${badges?`<span style="display:flex;gap:4px">${badges}</span>`:''}</span></button><button class="icon-btn sm ev-edit" data-edit="${e.id}" aria-label="Edit ${esc(e.title)}" title="Edit">${ui('edit')}</button></div>`; }).join('');
}
$('#list').addEventListener('click',e=>{ const ed=e.target.closest('[data-edit]'); if(ed){ openEventEditor(byId(W(),ed.dataset.edit)); return; } const b=e.target.closest('[data-id]'); if(b) select(b.dataset.id,true); });
$('#list').addEventListener('dblclick',e=>{ const b=e.target.closest('[data-id]'); if(b) openEventEditor(byId(W(),b.dataset.id)); });
$('#search').addEventListener('input',e=>{ ui$.query=e.target.value; renderList(); schedule(); });
$('#kind-filter').addEventListener('click',e=>{ const b=e.target.closest('[data-k]'); if(!b) return; ui$.kind=b.dataset.k; $$('#kind-filter button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); renderList(); });

function select(id,center){
  ui$.selected=id;
  const e=id && byId(W(),id);
  if(e && center) centerOn(e);
  renderList(); renderDetail(); schedule();
  if(id){ const row=$(`#list [data-id="${id}"]`); row && row.scrollIntoView({block:'nearest'}); }
}

/* ---------- detail ---------- */
function linkChip(w,x,note){ const c=evColor(w,x); return `<button class="link-chip" data-goto="${x.id}"><i style="background:${c}"></i>${esc(x.title)}${note?` <small>${esc(note)}</small>`:''}</button>`; }
function ageNote(w,life,dt,dp){
  if(!life || life.kind!=='life') return '';
  const a=ageAt(life.start,life.prec,dt), approx=life.approx||life.prec!=='day'||dp!=='day';
  if(a<0) return 'not yet born';
  if(life.end && unitStart(w.calendar,dt,dp)>=unitEnd(w.calendar,life.end,life.prec)) return 'deceased';
  return (approx?'c. ':'')+'age '+a;
}
function renderDetail(){
  const w=W(), cal=w.calendar, box=$('#detail');
  const e=ui$.selected && byId(w,ui$.selected);
  if(!e || !visibleEv(w,e)){
    const evs=w.events.filter(x=>visibleEv(w,x)), n=evs.length; let span='nothing yet';
    if(n){ const lo=Math.min(...evs.map(x=>evStart(w,x))), hi=Math.max(...evs.map(x=>evEnd(w,x))); span=fmtSpan(cal,hi-lo); }
    box.innerHTML=`<div class="welcome"><h3>${esc(w.name)}</h3>
      <div class="stats"><div><b>${evs.filter(x=>x.kind==='moment').length}</b><span>moments</span></div><div><b>${evs.filter(x=>x.kind==='period').length}</b><span>periods</span></div><div><b>${evs.filter(x=>x.kind==='life').length}</b><span>characters</span></div><div><b>${calBase(cal)}</b><span>days a year</span></div></div>
      <p>The chronicle spans ${esc(span)}. Select an event on the timeline, the month grid or the list to read it here.</p>
      <p>Shortcuts: <kbd>N</kbd> new event, <kbd>M</kbd> timeline / month, <kbd>P</kbd> player view, <kbd>F</kbd> fit all, <kbd>.</kbd> jump to now, <kbd>+</kbd>/<kbd>−</kbd> zoom, <kbd>←</kbd>/<kbd>→</kbd> pan, <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo, <kbd>Shift</kbd>+<kbd>1</kbd>…<kbd>9</kbd> save a bookmark, <kbd>1</kbd>…<kbd>9</kbd> jump to it, <kbd>Backspace</kbd> back.</p></div>`;
    return;
  }
  const c=evColor(w,e), cat=catOf(w,e.cat), s=evStart(w,e), en=evEnd(w,e);
  const wd=e.prec==='day', circa=e.approx||e.prec!=='day'?'c. ':'';
  const facts=[];
  const F=(k,v,plain)=>facts.push(`<dt>${k}</dt><dd${plain?' class="plain"':''}>${v}</dd>`);
  if(e.kind==='life'){
    F('Born',esc(fmtP(cal,e.start,e.prec,e.approx,wd)));
    if(e.end){ F('Died',esc(fmtP(cal,e.end,e.prec,e.approx,wd))); F('Age at death',esc(circa+ageAt(e.start,e.prec,e.end))); }
    else if(w.now){ const a=ageAt(e.start,e.prec,w.now); F('Age now',esc(a<0?'not yet born':circa+a)); }
  } else if(hasEnd(e)){
    F('From',esc(fmtP(cal,e.start,e.prec,e.approx,wd))); F('Until',esc(fmtP(cal,e.end,e.prec,e.approx,wd))); F('Lasted',esc(circa+fmtSpan(cal,en-s)));
  } else {
    F('Date',esc(fmtP(cal,e.start,e.prec,e.approx,wd)));
    if(e.repeat) F('Repeats',esc(repeatLabel(e)));
  }
  if(w.now && e.kind!=='life' && !e.repeat){ const n=toDay(cal,w.now);
    let rel; if(n>=s && n<en) rel=e.kind==='moment'?(e.prec==='day'?'Today':'Around now'):'Ongoing now';
    else if(n<s) rel=`${circa}${fmtSpan(cal,s-n)} from now`;
    else rel=`${circa}${fmtSpan(cal,n-(en-1))} ago`;
    F('Relative',esc(rel)); }
  if(e.location) F('Location',esc(e.location),true);
  if(e.session) F('Session',esc(e.session),true);
  const who=involved(w,e);
  if(who.length) F('Involved',`<span class="chips-inline">${who.map(x=>linkChip(w,x,ageNote(w,x,e.start,e.prec))).join('')}</span>`,true);
  const cs=causes(w,e), ef=effects(w,e);
  if(cs.length) F('Caused by',`<span class="chips-inline">${cs.map(x=>linkChip(w,x)).join('')}</span>`,true);
  if(ef.length) F('Led to',`<span class="chips-inline">${ef.map(x=>linkChip(w,x)).join('')}</span>`,true);
  if(e.kind==='life'){
    if(e.phases.length) F('Phases',`<span class="chips-inline">${[...e.phases].sort((a,b)=>toDay(cal,a.start)-toDay(cal,b.start)).map(ph=>`<span class="link-chip" style="cursor:default"><i style="background:${ph.color}"></i>${esc(ph.label)} <small>from ${esc(fmtDate(cal,ph.start))}</small></span>`).join('')}</span>`,true);
    const apps=w.events.filter(x=>x.who.includes(e.id) && visibleEv(w,x)).sort((a,b)=>evStart(w,a)-evStart(w,b));
    if(apps.length) F('On stage',esc(`${fmtP(cal,apps[0].start,apps[0].prec,apps[0].approx)} → ${fmtEvDate(w,apps[apps.length-1]).split(' → ').pop()}`));
    if(apps.length) F('Appears in',`<span class="chips-inline">${apps.map(x=>linkChip(w,x,ageNote(w,e,x.start,x.prec))).join('')}</span>`,true);
  }
  if(e.tags.length) F('Tags',`<span class="tags">${e.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</span>`,true);
  if(/^https?:\/\//i.test(e.link)) F('Link',`<a href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.link)}</a>`,true);
  const kindName={moment:'Moment',period:'Period',life:'Character'}[e.kind];
  box.innerHTML=`
    <div class="kicker" style="color:${c}"><span>${kindName}${cat?' · '+esc(cat.name):''}</span>${e.secret?'<span class="badge secret">Secret</span>':''}</div>
    <h3><span class="ev-ico ${e.kind}" style="background:${c};color:${textOn(c)}">${icon(e.icon)}</span>${esc(e.title)}</h3>
    <dl class="facts">${facts.join('')}</dl>
    <div class="md${e.desc?'':' empty'}">${e.desc?md(e.desc):'No description yet. Press Edit to add one.'}</div>
    ${!S.playerView && e.dmNotes?`<div class="dm-notes"><span class="lbl">DM notes · hidden in player view</span><div class="md">${md(e.dmNotes)}</div></div>`:''}
    <div class="detail-actions">
      <button class="btn primary" data-act="edit">${ui('edit')}Edit</button>
      <button class="btn" data-act="dup">${ui('copy')}Duplicate</button>
      <button class="btn" data-act="now">${ui('now')}Set as now</button>
      <button class="btn" data-act="focus">${ui('fit')}Show</button>
      <button class="btn danger" data-act="del">${ui('trash')}Delete</button>
    </div>`;
}
$('#detail').addEventListener('click',ev=>{
  const g=ev.target.closest('[data-goto]'); if(g){ select(g.dataset.goto,true); return; }
  const b=ev.target.closest('[data-act]'); if(!b) return;
  const w=W(), e=byId(w,ui$.selected); if(!e) return;
  const a=b.dataset.act;
  if(a==='edit') openEventEditor(e);
  else if(a==='dup'){ const c=JSON.parse(JSON.stringify(e)); c.id=uid(); c.title=e.title+' (copy)'; commit(()=>w.events.push(c)); select(c.id,false); }
  else if(a==='now'){ commit(()=>{ w.now=fromDay(w.calendar,evStart(w,e)); }); toast('Current date set'); }
  else if(a==='focus'){ centerOn(e); schedule(); }
  else if(a==='del') armDelete(b,()=>{ commit(()=>deleteEvent(w,e.id)); toast('Event deleted. Undo with Ctrl+Z'); });
});
function armDelete(btn,fn){
  if(btn.classList.contains('armed')){ fn(); return; }
  const old=btn.innerHTML; btn.classList.add('armed'); btn.textContent='Click again to confirm';
  setTimeout(()=>{ if(btn.isConnected){ btn.classList.remove('armed'); btn.innerHTML=old; } },3000);
}

/* ---------- modals ---------- */
let overlay=null;
function openModal(title,html,wide){
  closeModal(); hidePop();
  overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`<div class="modal${wide?' wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${esc(title)}</h2><button class="icon-btn sm" data-close aria-label="Close">${ui('x')}</button></div><div class="modal-body">${html}</div></div>`;
  overlay.addEventListener('mousedown',e=>{ if(e.target===overlay) closeModal(); });
  overlay.querySelector('[data-close]').addEventListener('click',closeModal);
  document.body.appendChild(overlay);
  const f=overlay.querySelector('.modal-body input:not([type=checkbox]):not([type=color]):not([type=file]),.modal-body textarea,.modal-body select'); if(f) f.focus();
  return overlay;
}
function closeModal(){ if(overlay){ overlay.remove(); overlay=null; } }

function dateFieldsHTML(id,dt){
  const cal=W().calendar; dt=norm(cal,dt);
  const e=eraOf(cal,dt.y), eras=sortedEras(cal);
  const months=cal.months.map((m,i)=>`<option value="${i}"${i===dt.m?' selected':''}>${esc(m.name)}${m.ic?' ✦':''}</option>`).join('');
  let era='';
  if(eras.length){
    const opts=(hasPre(cal)?`<option value="pre"${e.idx==='pre'?' selected':''}>${esc(cal.preEra.abbr||cal.preEra.name)}</option>`:'')+eras.map((x,i)=>`<option value="${i}"${e.idx===i?' selected':''}>${esc(x.abbr||x.name)}</option>`).join('');
    era=`<select class="inp" id="${id}-e" aria-label="Era">${opts}</select>`;
  }
  return `<div class="datef${era?'':' noera'}"><input class="inp" type="number" id="${id}-d" value="${dt.d}" min="1" aria-label="Day"><select class="inp" id="${id}-m" aria-label="Month">${months}</select><input class="inp" type="number" id="${id}-y" value="${e.ey}" aria-label="Year">${era}</div>`;
}
function readDate(id){
  const cal=W().calendar, eras=sortedEras(cal);
  const d=parseInt($('#'+id+'-d').value,10)||1, m=parseInt($('#'+id+'-m').value,10)||0;
  let ey=parseInt($('#'+id+'-y').value,10); if(!isFinite(ey)) ey=1;
  let y=ey; const es=$('#'+id+'-e');
  if(es){ if(es.value==='pre') y=eras[0].start-ey; else y=eras[+es.value].start+ey-1; }
  return {y,m,d};
}
function pickList(id,items,sel){
  if(!items.length) return '';
  return `<div class="pick" id="${id}">${items.length>8?`<input class="inp pick-filter" type="text" placeholder="Filter…" aria-label="Filter list">`:''}<div class="pick-box">${items.map(it=>`<label class="check" data-txt="${esc(it.label.toLowerCase())}"><input type="checkbox" value="${it.id}"${sel.includes(it.id)?' checked':''}><span>${esc(it.label)}</span></label>`).join('')}</div></div>`;
}
const pickVals=(root,id)=>$$(`#${id} input[type=checkbox]:checked`,root).map(x=>x.value);

/* event editor */
function openEventEditor(ev,preset){
  const w=W(), cal=w.calendar, isNew=!ev;
  ensureView();
  const center=fromDay(cal,w.view.start+(stageWidth()/2)/w.view.ppd);
  const pre=preset||{};
  const e = ev ? JSON.parse(JSON.stringify(ev)) : blankEvent({start:pre.start||(w.now?{...w.now}:center),end:pre.end||null,kind:pre.kind||'moment',prec:pre.prec||'day',approx:!!pre.approx,cat:(w.categories[0]||{}).id||'',session:String(w.session||'')});
  const hadEnd=!!e.end;
  if(!e.end) e.end=fromDay(cal,toDay(cal,e.start)+Math.round(avgYear(cal)));
  const catOpts=`<option value="">No category</option>`+w.categories.map(c=>`<option value="${c.id}"${c.id===e.cat?' selected':''}>${esc(c.name)}</option>`).join('');
  const chars=w.events.filter(x=>x.kind==='life' && x.id!==e.id).sort((a,b)=>a.title.localeCompare(b.title)).map(x=>({id:x.id,label:x.title}));
  const others=w.events.filter(x=>x.id!==e.id).sort((a,b)=>evStart(w,a)-evStart(w,b)).map(x=>({id:x.id,label:`${x.title} · ${fmtP(cal,x.start,x.prec,x.approx)}`}));
  const locs=[...new Set(w.events.map(x=>x.location.trim()).filter(Boolean))];
  const rep=e.repeat||{unit:'',every:1};
  const ov=openModal(isNew?'New event':'Edit event',`
    <div class="field"><label for="ev-title">Title</label><input type="text" id="ev-title" value="${esc(e.title)}" placeholder="e.g. The Siege of Thundermount"></div>
    <div class="field"><span class="lbl">Type</span><div class="seg" id="ev-kind" role="group"><button type="button" data-k="moment" aria-pressed="${e.kind==='moment'}">Moment</button><button type="button" data-k="period" aria-pressed="${e.kind==='period'}">Period</button><button type="button" data-k="life" aria-pressed="${e.kind==='life'}">Character</button></div></div>
    <div class="row">
      <div class="field"><label for="ev-prec">How precise is the date?</label><select id="ev-prec"><option value="day"${e.prec==='day'?' selected':''}>Exact day</option><option value="month"${e.prec==='month'?' selected':''}>Month only</option><option value="year"${e.prec==='year'?' selected':''}>Year only</option></select></div>
      <label class="check" style="flex:1 1 160px;padding-bottom:8px"><input type="checkbox" id="ev-approx"${e.approx?' checked':''}>Approximate (shown as “c.”)</label>
    </div>
    <div class="field"><span class="lbl" id="ev-start-l"></span>${dateFieldsHTML('ev-s',e.start)}</div>
    <div class="field" id="ev-end-f"><span class="lbl" id="ev-end-l"></span><label class="check" id="ev-alive-w"><input type="checkbox" id="ev-alive"${e.kind==='life'&&!hadEnd?' checked':''}>Still alive</label><div id="ev-end-dates">${dateFieldsHTML('ev-e',e.end)}</div></div>
    <div class="field" id="ev-ph-f"><span class="lbl">Life phases</span><div id="ev-phases" style="display:flex;flex-direction:column;gap:6px"></div><div class="row"><button type="button" class="btn" id="ev-ph-add">${ui('plus')}Add phase</button></div><p class="help">A phase runs from its date until the next phase or the end of the line, e.g. “Feywild” then “Stranded in the Drift”.</p></div>
    <div class="row" id="ev-rep-row">
      <div class="field"><label for="ev-rep">Repeats</label><select id="ev-rep"><option value=""${!rep.unit?' selected':''}>Doesn't repeat</option><option value="year"${rep.unit==='year'?' selected':''}>Every N years</option><option value="day"${rep.unit==='day'?' selected':''}>Every N days</option></select></div>
      <div class="field" style="flex:0 1 120px"><label for="ev-rep-n">N</label><input type="number" id="ev-rep-n" min="1" value="${rep.every||1}"></div>
    </div>
    <div class="row">
      <div class="field"><label for="ev-cat">Category</label><select id="ev-cat">${catOpts}</select></div>
      <div class="field"><span class="lbl">Colour</span><div class="color-row"><input type="color" id="ev-color" value="${e.color||evColor(w,e)}" aria-label="Event colour"><label class="check"><input type="checkbox" id="ev-usecat"${e.color?'':' checked'}>Use category colour</label></div></div>
    </div>
    <label class="check" id="ev-line-w"><input type="checkbox" id="ev-line"${e.line?' checked':''}><span id="ev-line-l"></span></label>
    <div class="field"><span class="lbl">Icon</span><div class="icon-grid" id="ev-icons">${Object.keys(ICONS).map(k=>`<button type="button" data-icon="${k}" aria-pressed="${k===e.icon}" title="${k}" aria-label="${k}">${icon(k)}</button>`).join('')}</div></div>
    <div class="field"><label for="ev-desc">Description</label><textarea id="ev-desc" placeholder="What happened, who was there, consequences… Supports **bold**, *italic*, - lists and [links](https://…)">${esc(e.desc)}</textarea></div>
    <div class="field"><label for="ev-dm">DM notes (hidden in player view)</label><textarea id="ev-dm" placeholder="Secrets, hooks, what the players don't know yet" style="min-height:70px">${esc(e.dmNotes)}</textarea></div>
    <label class="check"><input type="checkbox" id="ev-secret"${e.secret?' checked':''}>Secret event: hide it completely in player view</label>
    <div class="row">
      <div class="field"><label for="ev-loc">Location</label><input type="text" id="ev-loc" list="ev-loc-list" value="${esc(e.location)}" placeholder="e.g. Wyldermoore"><datalist id="ev-loc-list">${locs.map(l=>`<option value="${esc(l)}">`).join('')}</datalist></div>
      <div class="field" style="flex:0 1 130px"><label for="ev-ses">Session</label><input type="text" id="ev-ses" value="${esc(e.session)}" placeholder="e.g. 14"></div>
    </div>
    ${chars.length?`<div class="field" id="ev-who-f"><span class="lbl">Characters involved</span>${pickList('ev-who',chars,e.who)}</div>`:''}
    ${others.length?`<div class="field"><span class="lbl">Led to (consequences)</span>${pickList('ev-led',others,e.ledTo)}</div>`:''}
    <div class="row">
      <div class="field"><label for="ev-tags">Tags</label><input type="text" id="ev-tags" value="${esc(e.tags.join(', '))}" placeholder="comma, separated"></div>
      <div class="field"><label for="ev-link">Link</label><input type="url" id="ev-link" value="${esc(e.link)}" placeholder="https://notion.so/…"></div>
    </div>
    <p class="err" id="ev-err" hidden></p>
    <div class="modal-foot">${isNew?'':`<button class="btn danger left" id="ev-del">${ui('trash')}Delete</button>`}<button class="btn" data-close2>Cancel</button><button class="btn primary" id="ev-save">${isNew?'Add event':'Save changes'}</button></div>`);
  let kind=e.kind, ic=e.icon;
  let phs=(e.phases||[]).map(x=>({...x}));
  const PH_COLORS=['#c2611f','#5b6bd6','#2f9a2a','#b0142f','#7b3fa0','#0f766e'];
  const syncPh=()=>{ $$('#ev-phases .ph-row',ov).forEach((r,i)=>{ phs[i].label=$('[data-f=label]',r).value; phs[i].color=$('[data-f=color]',r).value; phs[i].start=norm(cal,readDate('ph'+i)); }); };
  const paintPh=()=>{ $('#ev-phases',ov).innerHTML=phs.length?phs.map((ph,i)=>`<div class="ph-row"><input class="inp" data-f="label" value="${esc(ph.label)}" placeholder="Phase name" aria-label="Phase name">${dateFieldsHTML('ph'+i,ph.start)}<input type="color" data-f="color" value="${ph.color}" aria-label="Phase colour"><button type="button" class="icon-btn sm" data-phdel="${i}" aria-label="Remove phase">${ui('x')}</button></div>`).join(''):'<p class="help">No phases yet.</p>'; };
  const refresh=()=>{
    const p=$('#ev-prec',ov).value, alive=$('#ev-alive',ov).checked;
    $('#ev-start-l',ov).textContent={moment:'Date',period:'Starts',life:'Born'}[kind];
    $('#ev-end-l',ov).textContent=kind==='life'?'Died':'Ends (inclusive)';
    $('#ev-end-f',ov).hidden=kind==='moment';
    $('#ev-alive-w',ov).hidden=kind!=='life';
    $('#ev-end-dates',ov).hidden=kind==='life'&&alive;
    $('#ev-rep-row',ov).hidden=kind!=='moment';
    $('#ev-rep-n',ov).disabled=!$('#ev-rep',ov).value;
    $('#ev-line-w',ov).hidden=kind==='life';
    $('#ev-line-l',ov).textContent=kind==='period'?'Shade this period across the whole timeline':'Draw a milestone line across the whole timeline';
    const whoF=$('#ev-who-f',ov); if(whoF) whoF.hidden=kind==='life';
    $('#ev-ph-f',ov).hidden=kind!=='life';
    ['ev-s','ev-e'].forEach(id=>{ $('#'+id+'-d',ov).disabled=p!=='day'; $('#'+id+'-m',ov).disabled=p==='year'; });
  };
  paintPh(); refresh();
  ov.addEventListener('change',refresh);
  $('#ev-ph-add',ov).addEventListener('click',()=>{ syncPh(); const last=phs.length?phs[phs.length-1].start:readDate('ev-s'); phs.push({id:uid(),label:'',start:norm(cal,last),color:PH_COLORS[phs.length%PH_COLORS.length]}); paintPh(); const ins=$$('#ev-phases [data-f=label]',ov); ins[ins.length-1].focus(); });
  $('#ev-phases',ov).addEventListener('click',x=>{ const b=x.target.closest('[data-phdel]'); if(!b) return; syncPh(); phs.splice(+b.dataset.phdel,1); paintPh(); });
  ov.querySelector('#ev-kind').addEventListener('click',x=>{ const b=x.target.closest('[data-k]'); if(!b) return; const was=kind; kind=b.dataset.k;
    $$('#ev-kind button',ov).forEach(y=>y.setAttribute('aria-pressed',String(y===b)));
    if(kind==='life' && was!=='life' && ic==='star'){ ic='person'; $$('#ev-icons button',ov).forEach(y=>y.setAttribute('aria-pressed',String(y.dataset.icon==='person'))); }
    refresh(); });
  ov.querySelector('#ev-icons').addEventListener('click',x=>{ const b=x.target.closest('[data-icon]'); if(!b) return; ic=b.dataset.icon; $$('#ev-icons button',ov).forEach(y=>y.setAttribute('aria-pressed',String(y===b))); });
  ov.addEventListener('input',x=>{ if(x.target.classList.contains('pick-filter')){ const q=x.target.value.toLowerCase(); $$('label',x.target.parentNode).forEach(l=>l.hidden=!l.dataset.txt.includes(q)); } });
  $('#ev-color',ov).addEventListener('input',()=>{ $('#ev-usecat',ov).checked=false; });
  $('#ev-cat',ov).addEventListener('change',x=>{ if($('#ev-usecat',ov).checked){ const c=catOf(w,x.target.value); if(c) $('#ev-color',ov).value=c.color; } });
  ov.querySelector('[data-close2]').addEventListener('click',closeModal);
  if(!isNew) $('#ev-del',ov).addEventListener('click',x=>armDelete(x.currentTarget,()=>{ closeModal(); commit(()=>deleteEvent(w,e.id)); toast('Event deleted. Undo with Ctrl+Z'); }));
  const save=()=>{
    const err=$('#ev-err',ov), fail=msg=>{ err.hidden=false; err.textContent=msg; err.scrollIntoView({block:'nearest'}); };
    const title=$('#ev-title',ov).value.trim();
    if(!title){ fail('Give the event a title.'); $('#ev-title',ov).focus(); return; }
    if(kind==='life') syncPh();
    const p=$('#ev-prec',ov).value;
    const trim=dt=>{ dt=norm(cal,dt); if(p==='year') return {y:dt.y,m:0,d:1}; if(p==='month') return {y:dt.y,m:dt.m,d:1}; return dt; };
    const s=trim(readDate('ev-s')); let en=null;
    if(kind==='period' || (kind==='life' && !$('#ev-alive',ov).checked)){
      en=trim(readDate('ev-e'));
      if(unitStart(cal,en,p)<unitStart(cal,s,p)) return fail(kind==='life'?'The death date is before the birth date.':'The end date is before the start date. Swap them or pick a later end.');
    }
    const link=$('#ev-link',ov).value.trim();
    if(link && !/^https?:\/\//i.test(link)) return fail('Links need to start with http:// or https://');
    const ru=$('#ev-rep',ov).value, rn=parseInt($('#ev-rep-n',ov).value,10);
    if(kind==='moment' && ru && !(rn>=1)) return fail('“Repeats every N” needs N of 1 or more.');
    const out=Object.assign(blankEvent({}),{id:e.id,title,kind,start:s,end:en,prec:p,approx:$('#ev-approx',ov).checked,cat:$('#ev-cat',ov).value,icon:ic,
      color:$('#ev-usecat',ov).checked?'':$('#ev-color',ov).value,line:kind!=='life'&&$('#ev-line',ov).checked,
      tags:$('#ev-tags',ov).value.split(',').map(t=>t.trim()).filter(Boolean),link,desc:$('#ev-desc',ov).value,dmNotes:$('#ev-dm',ov).value,
      secret:$('#ev-secret',ov).checked,location:$('#ev-loc',ov).value.trim(),session:$('#ev-ses',ov).value.trim(),
      who:kind==='life'?[]:pickVals(ov,'ev-who'),ledTo:pickVals(ov,'ev-led'),repeat:kind==='moment'&&ru?{unit:ru,every:rn}:null,
      phases:kind==='life'?phs.filter(x=>x.label.trim()).map(x=>({...x,label:x.label.trim()})).sort((a,b)=>toDay(cal,a.start)-toDay(cal,b.start)):[]});
    closeModal();
    commit(()=>{ const i=w.events.findIndex(x=>x.id===out.id); if(i>=0) w.events[i]=out; else w.events.push(out); });
    if(S.playerView && out.secret) toast('Saved. It is secret, so player view hides it.');
    else { select(out.id,isNew); toast(isNew?'Event added':'Saved'); }
  };
  $('#ev-save',ov).addEventListener('click',save);
  $('#ev-title',ov).addEventListener('keydown',x=>{ if(x.key==='Enter') save(); });
}

/* current date & sessions */
function openNowModal(){
  const w=W(), cal=w.calendar; ensureView();
  const dt=w.now || fromDay(cal,w.view.start+(stageWidth()/2)/w.view.ppd);
  const ov=openModal('Current date & sessions',`
    <p class="help">The “Now” line marks where the story currently stands. Step it a day at a time with the arrows in the header.</p>
    <div class="field"><span class="lbl">Current date</span>${dateFieldsHTML('nw',dt)}</div>
    <div class="row">
      <div class="field" style="flex:0 1 160px"><label for="nw-ses">Current session</label><input type="number" id="nw-ses" min="1" value="${w.session}"></div>
      <p class="help" style="flex:1 1 220px;padding-bottom:8px">New events are tagged with this session. “End session” records where the story stood and moves on to the next one.</p>
    </div>
    ${w.sessionLog.length?`<fieldset><legend>Session log</legend><div class="tbl-wrap"><table class="ed"><thead><tr><th>Session</th><th>Story date at the end</th><th>Played on</th><th></th></tr></thead><tbody>${[...w.sessionLog].reverse().map(s=>`<tr><td>S${esc(s.n)}</td><td style="font-family:var(--f-mono);font-size:12.5px">${s.now?esc(fmtDate(cal,s.now)):'–'}</td><td style="font-family:var(--f-mono);font-size:12.5px">${esc(s.at||'')}</td><td class="act"><button class="icon-btn sm" data-slog="${esc(s.id)}" aria-label="Remove log entry">${ui('x')}</button></td></tr>`).join('')}</tbody></table></div></fieldset>`:''}
    <div class="modal-foot"><button class="btn left" id="nw-clear">Clear date</button><button class="btn" id="nw-end">End session ${w.session} here</button><button class="btn" data-close2>Cancel</button><button class="btn primary" id="nw-save">Save</button></div>`);
  ov.querySelector('[data-close2]').addEventListener('click',closeModal);
  const ses=()=>Math.max(1,parseInt($('#nw-ses',ov).value,10)||1);
  $('#nw-clear',ov).addEventListener('click',()=>{ closeModal(); commit(()=>{ w.now=null; }); });
  $('#nw-save',ov).addEventListener('click',()=>{ const d=norm(cal,readDate('nw')), s=ses(); closeModal(); commit(()=>{ w.now=d; w.session=s; }); });
  $('#nw-end',ov).addEventListener('click',()=>{ const d=norm(cal,readDate('nw')), s=ses(); closeModal();
    commit(()=>{ w.now=d; w.sessionLog.push({id:uid(),n:s,now:d,at:new Date().toISOString().slice(0,10)}); w.session=s+1; });
    toast(`Session ${s} logged. Now on session ${s+1}`); });
  ov.addEventListener('click',x=>{ const b=x.target.closest('[data-slog]'); if(!b) return; const id=b.dataset.slog; closeModal(); commit(()=>{ w.sessionLog=w.sessionLog.filter(s=>s.id!==id); }); openNowModal(); });
}

/* new world */
function openNewWorldModal(){
  const ov=openModal('New world',`
    <p class="help">Each world has its own calendar, categories, events and sessions.</p>
    <div class="field"><label for="nw-name">Name</label><input type="text" id="nw-name" placeholder="e.g. Scarred Lands"></div>
    <div class="field"><label for="nw-preset">Start from</label><select id="nw-preset">${PRESETS.map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join('')}</select></div>
    <div class="modal-foot"><button class="btn" data-close2>Cancel</button><button class="btn primary" id="nw-create">Create world</button></div>`);
  ov.querySelector('[data-close2]').addEventListener('click',closeModal);
  $('#nw-create',ov).addEventListener('click',()=>{
    const w=newWorld($('#nw-name',ov).value.trim()||'New world',$('#nw-preset',ov).value);
    closeModal(); commit(()=>{ S.worlds.push(w); S.activeId=w.id; ui$.selected=null; ui$.month=null; });
