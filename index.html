/* calendar editor */
function openCalendarEditor(){
  const w=W();
  const draft={name:w.name, cal:JSON.parse(JSON.stringify(w.calendar))};
  draft.cal.preEra=draft.cal.preEra||{name:'',abbr:''};
  const ov=openModal('World & calendar','',true);
  const body=$('.modal-body',ov);
  const sync=()=>{
    draft.name=$('#ce-name',body).value;
    $$('[data-mi]',body).forEach(tr=>{ const m=draft.cal.months[+tr.dataset.mi]; m.name=$('[data-f=name]',tr).value; m.days=parseInt($('[data-f=days]',tr).value,10)||0; m.ic=$('[data-f=ic]',tr).checked; });
    draft.cal.weekdays=$('#ce-weekdays',body).value.split(',').map(s=>s.trim()).filter(Boolean);
    const ep=$('#ce-epoch',body); draft.cal.epochWeekday=ep?(parseInt(ep.value,10)||0):0;
    $$('[data-li]',body).forEach(tr=>{ const r=draft.cal.leap[+tr.dataset.li]; r.every=parseInt($('[data-f=every]',tr).value,10)||0; r.offset=parseInt($('[data-f=offset]',tr).value,10)||0; r.days=parseInt($('[data-f=days]',tr).value,10)||0; r.month=parseInt($('[data-f=month]',tr).value,10)||0; });
    $$('[data-ei]',body).forEach(tr=>{ const r=draft.cal.eras[+tr.dataset.ei]; r.name=$('[data-f=name]',tr).value; r.abbr=$('[data-f=abbr]',tr).value; r.start=parseInt($('[data-f=start]',tr).value,10)||0; });
    draft.cal.preEra={name:$('#ce-pre-name',body).value, abbr:$('#ce-pre-abbr',body).value};
  };
  const summary=()=>{
    const c=draft.cal; if(!c.months.length) return 'Add at least one month.';
    const lens=new Set(); for(let y=1;y<=400;y++) lens.add(yearLen(c,y));
    return `Common year: ${calBase(c)} days · year lengths over 400 years: ${[...lens].sort((a,b)=>a-b).join(', ')} · average ${avgYear(c).toFixed(4)} days${c.weekdays.length?` · ${c.weekdays.length}-day week`:''}`;
  };
  const paint=()=>{
    const c=draft.cal;
    const monthOpts=sel=>c.months.map((m,i)=>`<option value="${i}"${i===sel?' selected':''}>${esc(m.name||('Month '+(i+1)))}</option>`).join('');
    body.innerHTML=`
      <div class="row">
        <div class="field"><label for="ce-name">World name</label><input type="text" id="ce-name" value="${esc(draft.name)}"></div>
        <div class="field"><label for="ce-preset">Replace calendar with a preset</label><div class="row" style="flex-wrap:nowrap"><select id="ce-preset" class="inp">${PRESETS.map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join('')}</select><button class="btn" id="ce-load">Load</button></div></div>
      </div>
      <fieldset><legend>Months</legend>
        <div class="tbl-wrap"><table class="ed"><thead><tr><th>#</th><th>Name</th><th>Days</th><th title="Festival days or intercalary months sit outside the regular months">Festival</th><th></th></tr></thead><tbody>
        ${c.months.map((m,i)=>`<tr data-mi="${i}"><td class="num">${i+1}</td><td><input class="inp" data-f="name" value="${esc(m.name)}" aria-label="Month ${i+1} name"></td><td style="width:90px"><input class="inp" type="number" min="0" data-f="days" value="${m.days}" aria-label="Days in month ${i+1}"></td><td style="width:70px;text-align:center"><input type="checkbox" data-f="ic"${m.ic?' checked':''} aria-label="Festival month"></td><td class="act"><button class="icon-btn sm" data-mup="${i}" aria-label="Move up"${i===0?' disabled':''}>${ui('up')}</button> <button class="icon-btn sm" data-mdn="${i}" aria-label="Move down"${i===c.months.length-1?' disabled':''}>${ui('down')}</button> <button class="icon-btn sm" data-mdel="${i}" aria-label="Remove month"${c.months.length<2?' disabled':''}>${ui('x')}</button></td></tr>`).join('')}
        </tbody></table></div>
        <div class="row"><button class="btn" id="ce-addm">${ui('plus')}Add month</button></div>
        <p class="help">Festival months show as a single named day (e.g. “Midwinter”) and are marked ✦ in date pickers. A month can have 0 days and get its days only from a leap rule. Events keep their month number, so removing or reordering months moves them.</p>
      </fieldset>
      <fieldset><legend>Week</legend>
        <div class="row">
          <div class="field" style="flex:2 1 260px"><label for="ce-weekdays">Weekday names (comma separated, leave empty for none)</label><input type="text" id="ce-weekdays" value="${esc(c.weekdays.join(', '))}"></div>
          ${c.weekdays.length?`<div class="field"><label for="ce-epoch">First day of year 1 is a</label><select id="ce-epoch">${c.weekdays.map((d,i)=>`<option value="${i}"${i===(+c.epochWeekday||0)?' selected':''}>${esc(d)}</option>`).join('')}</select></div>`:''}
        </div>
      </fieldset>
      <fieldset><legend>Leap rules</legend>
        ${c.leap.length?`<div class="tbl-wrap"><table class="ed"><thead><tr><th>Every N years</th><th>Offset</th><th>Add days</th><th>To month</th><th></th></tr></thead><tbody>
        ${c.leap.map((r,i)=>`<tr data-li="${i}"><td><input class="inp" type="number" min="1" data-f="every" value="${r.every}" aria-label="Every N years"></td><td><input class="inp" type="number" data-f="offset" value="${r.offset}" aria-label="Offset"></td><td><input class="inp" type="number" data-f="days" value="${r.days}" aria-label="Days to add"></td><td><select class="inp" data-f="month" aria-label="Month">${monthOpts(r.month)}</select></td><td class="act"><button class="icon-btn sm" data-ldel="${i}" aria-label="Remove rule">${ui('x')}</button></td></tr>`).join('')}
        </tbody></table></div>`:'<p class="help">No leap years. Every year has the same length.</p>'}
        <div class="row"><button class="btn" id="ce-addl">${ui('plus')}Add leap rule</button></div>
        <p class="help">A rule applies when (year − offset) divides evenly by N. Use negative days for exceptions, like the Gregorian “every 100 years, remove a day”.</p>
      </fieldset>
      <fieldset><legend>Eras</legend>
        ${c.eras.length?`<div class="tbl-wrap"><table class="ed"><thead><tr><th>Name</th><th>Abbreviation</th><th>Starts at absolute year</th><th></th></tr></thead><tbody>
        ${c.eras.map((r,i)=>`<tr data-ei="${i}"><td><input class="inp" data-f="name" value="${esc(r.name)}" aria-label="Era name"></td><td style="width:110px"><input class="inp" data-f="abbr" value="${esc(r.abbr)}" aria-label="Abbreviation"></td><td style="width:150px"><input class="inp" type="number" data-f="start" value="${r.start}" aria-label="Start year"></td><td class="act"><button class="icon-btn sm" data-edel="${i}" aria-label="Remove era">${ui('x')}</button></td></tr>`).join('')}
        </tbody></table></div>`:'<p class="help">No eras. Years show as plain numbers and can go negative.</p>'}
        <div class="row"><button class="btn" id="ce-adde">${ui('plus')}Add era</button></div>
        <div class="row">
          <div class="field"><label for="ce-pre-name">Years before the first era count backwards as</label><input type="text" id="ce-pre-name" value="${esc(c.preEra.name)}" placeholder="e.g. Before Founding"></div>
          <div class="field" style="flex:0 1 140px"><label for="ce-pre-abbr">Abbreviation</label><input type="text" id="ce-pre-abbr" value="${esc(c.preEra.abbr)}" placeholder="BF"></div>
        </div>
        <p class="help">Leave the backwards name empty to show earlier years as zero and negatives (e.g. −340 DR).</p>
      </fieldset>
      <div class="summary" id="ce-summary">${esc(summary())}</div>
      <p class="err" id="ce-err" hidden></p>
      <div class="modal-foot">${S.worlds.length>1?`<button class="btn danger left" id="ce-delworld">${ui('trash')}Delete world</button>`:''}<button class="btn" data-close2>Cancel</button><button class="btn primary" id="ce-save">Save calendar</button></div>`;
  };
  paint();
  body.addEventListener('change',()=>{ sync(); $('#ce-summary',body).textContent=summary(); });
  body.addEventListener('click',ev=>{
    const t=ev.target.closest('button'); if(!t) return; const c=draft.cal;
    if(t.matches('[data-close2]')){ closeModal(); return; }
    sync();
    if(t.id==='ce-load'){ draft.cal=makeCalendar($('#ce-preset',body).value); paint(); return; }
    if(t.id==='ce-addm'){ c.months.push({name:`Month ${c.months.length+1}`,days:30,ic:false}); paint(); return; }
    if(t.dataset.mup){ const i=+t.dataset.mup; [c.months[i-1],c.months[i]]=[c.months[i],c.months[i-1]]; c.leap.forEach(r=>{ if(r.month===i) r.month=i-1; else if(r.month===i-1) r.month=i; }); paint(); return; }
    if(t.dataset.mdn){ const i=+t.dataset.mdn; [c.months[i+1],c.months[i]]=[c.months[i],c.months[i+1]]; c.leap.forEach(r=>{ if(r.month===i) r.month=i+1; else if(r.month===i+1) r.month=i; }); paint(); return; }
    if(t.dataset.mdel){ const i=+t.dataset.mdel; c.months.splice(i,1); c.leap=c.leap.filter(r=>r.month!==i).map(r=>({...r,month:r.month>i?r.month-1:r.month})); paint(); return; }
    if(t.id==='ce-addl'){ c.leap.push({every:4,offset:0,month:0,days:1}); paint(); return; }
    if(t.dataset.ldel){ c.leap.splice(+t.dataset.ldel,1); paint(); return; }
    if(t.id==='ce-adde'){ const last=sortedEras(c).pop(); c.eras.push({name:'New era',abbr:'NE',start:last?last.start+1000:1}); paint(); return; }
    if(t.dataset.edel){ c.eras.splice(+t.dataset.edel,1); paint(); return; }
    if(t.id==='ce-delworld'){ armDelete(t,()=>{ closeModal(); commit(()=>{ S.worlds=S.worlds.filter(x=>x.id!==w.id); S.activeId=S.worlds[0].id; ui$.selected=null; ui$.month=null; }); toast('World deleted. Undo with Ctrl+Z'); }); return; }
    if(t.id==='ce-save'){
      const err=$('#ce-err',body), problems=[];
      if(!c.months.length) problems.push('Add at least one month.');
      if(calBase(c)<=0) problems.push('The year needs at least one day outside leap rules.');
      c.months.forEach((m,i)=>{ if(!m.name.trim()) problems.push(`Month ${i+1} needs a name.`); const neg=c.leap.filter(r=>r.month===i&&r.days<0).reduce((s,r)=>s+r.days,0); if(m.days+neg<0) problems.push(`${m.name||'Month '+(i+1)} could end up with fewer than 0 days.`); });
      c.leap.forEach((r,i)=>{ if(!(r.every>=1)) problems.push(`Leap rule ${i+1}: “every N years” must be 1 or more.`); });
      if(problems.length){ err.hidden=false; err.textContent=problems.join(' '); return; }
      closeModal(); ui$.month=null; commit(()=>{ w.name=draft.name.trim()||w.name; w.calendar=draft.cal; });
      toast('Calendar saved');
    }
  });
}

/* categories */
function openCategories(){
  const w=W(); const draft=JSON.parse(JSON.stringify(w.categories));
  const ov=openModal('Categories','');
  const body=$('.modal-body',ov);
  const sync=()=>$$('[data-ci]',body).forEach(tr=>{ const c=draft[+tr.dataset.ci]; c.name=$('[data-f=name]',tr).value; c.color=$('[data-f=color]',tr).value; });
  const paint=()=>{
    body.innerHTML=`<p class="help">Categories colour your events and let you show or hide groups. Click a category chip under “Events” to hide it.</p>
      ${draft.length?`<table class="ed"><tbody>${draft.map((c,i)=>`<tr data-ci="${i}"><td style="width:54px"><input type="color" data-f="color" value="${c.color}" aria-label="Colour"></td><td><input class="inp" data-f="name" value="${esc(c.name)}" aria-label="Category name"></td><td class="act"><span class="count">${w.events.filter(e=>e.cat===c.id).length}</span> <button class="icon-btn sm" data-cdel="${i}" aria-label="Remove category">${ui('x')}</button></td></tr>`).join('')}</tbody></table>`:'<p class="help">No categories yet.</p>'}
      <div class="row"><button class="btn" id="cat-add">${ui('plus')}Add category</button></div>
      <p class="help">Removing a category keeps its events; they become uncategorised.</p>
      <div class="modal-foot"><button class="btn" data-close2>Cancel</button><button class="btn primary" id="cat-save">Save categories</button></div>`;
  };
  paint();
  const palette=['#3647a8','#1b8fd1','#b0142f','#2f9a2a','#b8891b','#7b3fa0','#c2410c','#0f766e','#6b7280'];
  body.addEventListener('click',ev=>{ const t=ev.target.closest('button'); if(!t) return;
    if(t.matches('[data-close2]')){ closeModal(); return; }
    sync();
    if(t.id==='cat-add'){ draft.push({id:uid(),name:'New category',color:palette[draft.length%palette.length]}); paint(); const ins=$$('[data-f=name]',body); ins[ins.length-1].select(); return; }
    if(t.dataset.cdel){ draft.splice(+t.dataset.cdel,1); paint(); return; }
    if(t.id==='cat-save'){ closeModal(); commit(()=>{ const ids=new Set(draft.map(c=>c.id)); w.categories=draft.map(c=>({...c,name:c.name.trim()||'Untitled'})); w.events.forEach(e=>{ if(e.cat && !ids.has(e.cat)) e.cat=''; }); }); toast('Categories saved'); }
  });
}

/* date calculator */
function openCalculator(){
  const w=W(), cal=w.calendar; ensureView();
  const base=w.now || fromDay(cal,w.view.start+(stageWidth()/2)/w.view.ppd);
  const ov=openModal('Date calculator',`
    <fieldset><legend>Add or subtract time</legend>
      <div class="field"><span class="lbl">From</span>${dateFieldsHTML('cx',base)}</div>
      <div class="row">
        <div class="field"><label for="cx-yy">Years</label><input type="number" id="cx-yy" value="0"></div>
        <div class="field"><label for="cx-mm">Months</label><input type="number" id="cx-mm" value="0"></div>
        <div class="field"><label for="cx-dd">Days</label><input type="number" id="cx-dd" value="0"></div>
      </div>
      <div class="result" id="cx-out"></div>
      <div class="row"><button class="btn" id="cx-now">${ui('now')}Set as now</button><button class="btn" id="cx-new">${ui('plus')}New event on this date</button></div>
      <p class="help">Use negative numbers to go back in time. Years, then months, then days are applied in that order.</p>
    </fieldset>
    <fieldset><legend>Time between two dates</legend>
      <div class="field"><span class="lbl">From</span>${dateFieldsHTML('ca',base)}</div>
      <div class="field"><span class="lbl">To</span>${dateFieldsHTML('cb',base)}</div>
      <div class="result" id="cb-out"></div>
    </fieldset>`);
  let result=base;
  const calc=()=>{
    let d=norm(cal,readDate('cx'));
    d=addYears(cal,d,parseInt($('#cx-yy',ov).value,10)||0);
    d=addMonths(cal,d,parseInt($('#cx-mm',ov).value,10)||0);
    d=fromDay(cal,toDay(cal,d)+(parseInt($('#cx-dd',ov).value,10)||0));
    result=d; $('#cx-out',ov).innerHTML=`<b>${esc(fmtDate(cal,d,true))}</b>`;
    const a=toDay(cal,readDate('ca')), b=toDay(cal,readDate('cb')), diff=b-a, wk=cal.weekdays.length||7;
    $('#cb-out',ov).innerHTML = diff===0 ? '<b>Same day</b>' : `<b>${esc(fmtSpan(cal,diff))}</b> ${diff<0?'earlier':'later'} · ${Math.abs(diff).toLocaleString()} days · ${(Math.abs(diff)/wk).toFixed(1)} weeks`;
  };
  calc(); ov.addEventListener('input',calc); ov.addEventListener('change',calc);
  $('#cx-now',ov).addEventListener('click',()=>{ const d=result; closeModal(); commit(()=>{ w.now=d; }); toast('Current date set'); });
  $('#cx-new',ov).addEventListener('click',()=>{ const d=result; closeModal(); openEventEditor(null,{start:d}); });
}

/* image export */
function exportImage(){
  if(S.mode==='month'){ toast('Switch to the timeline view to save an image'); return; }
  renderTimeline();
  const clone=svg.cloneNode(true);
  const src=[svg,...$$('*',svg)], dst=[clone,...$$('*',clone)];
  const props=['fill','stroke','stroke-width','stroke-dasharray','stroke-linecap','opacity','fill-opacity','stroke-opacity','font-family','font-size','font-weight','font-style','letter-spacing'];
  src.forEach((el,i)=>{ const d=dst[i]; if(d.tagName==='title') return; const cs=getComputedStyle(el); props.forEach(p=>{ const v=cs.getPropertyValue(p); if(v) d.style.setProperty(p,v); }); d.removeAttribute('class'); });
  $$('title',clone).forEach(t=>t.remove());
  const W0=+svg.getAttribute('width'), H0=+svg.getAttribute('height');
  const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');
  bg.setAttribute('width',W0); bg.setAttribute('height',H0); bg.setAttribute('fill',getComputedStyle(tl).backgroundColor);
  clone.insertBefore(bg,clone.firstChild);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const str=new XMLSerializer().serializeToString(clone);
  const img=new Image();
  img.onload=()=>{
    const k=2, cv=document.createElement('canvas'); cv.width=W0*k; cv.height=H0*k;
    const ctx=cv.getContext('2d'); ctx.scale(k,k); ctx.drawImage(img,0,0);
    let url; try{ url=cv.toDataURL('image/png'); }catch(e){ toast('The image could not be created in this browser'); return; }
    const ov=openModal('Timeline image',`<p class="help">This is the visible part of the timeline. Right-click (or long-press) the image to save or copy it, or use the download button.</p><img class="img-preview" id="img-out" src="${url}" alt="Timeline of ${esc(W().name)}"><div class="modal-foot"><button class="btn primary" id="img-dl">Download .png</button></div>`,true);
    $('#img-dl',ov).addEventListener('click',()=>tryDownloadURL(slug(W().name)+'-timeline.png',url));
  };
  img.onerror=()=>toast('The image could not be created in this browser');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str);
}

/* data: export / import / CSV / Notion */
function exportEvents(w){ return [...w.events].filter(e=>!(S.playerView&&e.secret)).sort((a,b)=>evStart(w,a)-evStart(w,b)); }
function csvForWorld(w){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const name=id=>{ const x=byId(w,id); return x?x.title:''; };
  const head=['Title','Type','Start','End','Precision','Circa','StartYear','StartMonth','StartDay','EndYear','EndMonth','EndDay','Category','Icon','Location','Session','Secret','Repeats','Involved','LedTo','Tags','Link','Description'];
  if(!S.playerView) head.push('DMNotes');
  const rows=exportEvents(w).map(e=>{ const c=catOf(w,e.cat), en=e.end&&e.kind!=='moment'?e.end:null;
    const row=[e.title,{moment:'moment',period:'period',life:'character'}[e.kind],fmtP(w.calendar,e.start,e.prec,false),en?fmtP(w.calendar,en,e.prec,false):'',e.prec,e.approx?'yes':'',e.start.y,e.start.m+1,e.start.d,en?en.y:'',en?en.m+1:'',en?en.d:'',c?c.name:'',e.icon,e.location,e.session,e.secret?'yes':'',repeatLabel(e),e.who.map(name).join(', '),e.ledTo.map(name).join(', '),e.tags.join(', '),e.link,e.desc];
    if(!S.playerView) row.push(e.dmNotes);
    return row.map(q).join('^'); });
  return [head.map(q).join('^'),...rows].join('\r\n');
}
function notionMd(w){
  const cell=v=>String(v??'').replace(/\|/g,'\\|').replace(/\r?\n/g,' ');
  const evs=exportEvents(w);
  let s=`# ${w.name}\n\n| Date | Event | Type | Category | Location | Session | Tags |\n|---|---|---|---|---|---|---|\n`;
  for(const e of evs){ const c=catOf(w,e.cat); s+=`| ${cell(fmtEvDate(w,e))} | ${cell(e.title)} | ${{moment:'Moment',period:'Period',life:'Character'}[e.kind]} | ${cell(c?c.name:'')} | ${cell(e.location)} | ${cell(e.session)} | ${cell(e.tags.join(', '))} |\n`; }
  const withText=evs.filter(e=>e.desc||(!S.playerView&&e.dmNotes));
  if(withText.length){ s+='\n## Descriptions\n';
    for(const e of withText){ s+=`\n### ${e.title}\n*${fmtEvDate(w,e)}*\n\n${e.desc||''}\n`; if(!S.playerView && e.dmNotes) s+=`\n> **DM notes:** ${e.dmNotes.replace(/\r?\n/g,' ')}\n`; } }
  return s;
}
function tryDownload(name,text,mime,bom){
  try{ const blob=new Blob([bom?'﻿':'',text],{type:mime}); const u=URL.createObjectURL(blob); tryDownloadURL(name,u); setTimeout(()=>URL.revokeObjectURL(u),1500); }catch(e){}
}
function tryDownloadURL(name,url){ try{ const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),500); }catch(e){} }
function copyText(ta){
  const fallback=()=>{ ta.select(); toast('Selected. Press Ctrl+C to copy'); };
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(()=>toast('Copied'),fallback); return; } }catch(e){}
  fallback();
}
function slug(s){ return (s||'world').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'world'; }
function validWorld(x){ return x && typeof x==='object' && x.calendar && Array.isArray(x.calendar.months) && x.calendar.months.length && Array.isArray(x.events); }
function cleanWorld(x){ x.id=uid(); x.name=x.name||'Imported world'; x.view=null; return upgradeWorld(x); }
function openData(){
  const w=W(); const json=JSON.stringify(S,null,1), csv=csvForWorld(w), mdTxt=notionMd(w);
  const pv=S.playerView?' Player view is on, so secret events and DM notes are left out.':'';
  const ov=openModal('Data',`
    <fieldset><legend>Back up everything</legend>
      <p class="help">All worlds, calendars, events and sessions as JSON, including secrets. If the download doesn't start, copy the text and save it as a .json file.</p>
      <textarea class="code inp" id="dx-json" readonly aria-label="Backup JSON" style="height:110px;padding:8px">${esc(json)}</textarea>
      <div class="row"><button class="btn" id="dx-copy">${ui('copy')}Copy JSON</button><button class="btn" id="dx-dl">Download .json</button></div>
    </fieldset>
    <fieldset><legend>Import</legend>
      <p class="help">Load a backup file or paste JSON. A full backup or a single world both work.</p>
      <input type="file" id="dx-file" accept=".json,application/json" aria-label="Choose a JSON file">
      <textarea class="code inp" id="dx-paste" placeholder="…or paste JSON here" aria-label="Paste JSON" style="height:80px;padding:8px"></textarea>
      <p class="err" id="dx-err" hidden></p>
      <div class="row"><button class="btn" id="dx-add">Add as new world(s)</button><button class="btn danger" id="dx-replace">Replace everything</button></div>
    </fieldset>
    <fieldset><legend>For Notion: “${esc(w.name)}” as Markdown</legend>
      <p class="help">Paste into a Notion page to get a table of events followed by their descriptions.${pv}</p>
      <textarea class="code inp" id="dx-md" readonly aria-label="Markdown" style="height:90px;padding:8px">${esc(mdTxt)}</textarea>
      <div class="row"><button class="btn" id="dx-mcopy">${ui('copy')}Copy Markdown</button><button class="btn" id="dx-mdl">Download .md</button></div>
    </fieldset>
    <fieldset><legend>Events of “${esc(w.name)}” as CSV</legend>
      <p class="help">UTF-8 with BOM, “^” as the delimiter, every field quoted. Opens cleanly in Excel with Greek text.${pv}</p>
      <textarea class="code inp" id="dx-csv" readonly aria-label="CSV" style="height:80px;padding:8px">${esc(csv)}</textarea>
      <div class="row"><button class="btn" id="dx-ccopy">${ui('copy')}Copy CSV</button><button class="btn" id="dx-cdl">Download .csv</button></div>
    </fieldset>`,true);
  $('#dx-copy',ov).onclick=()=>copyText($('#dx-json',ov));
  $('#dx-dl',ov).onclick=()=>tryDownload('timeline-keeper-backup.json',json,'application/json',false);
  $('#dx-mcopy',ov).onclick=()=>copyText($('#dx-md',ov));
  $('#dx-mdl',ov).onclick=()=>tryDownload(slug(w.name)+'.md',mdTxt,'text/markdown;charset=utf-8',false);
  $('#dx-ccopy',ov).onclick=()=>copyText($('#dx-csv',ov));
  $('#dx-cdl',ov).onclick=()=>tryDownload(slug(w.name)+'-events.csv',csv,'text/csv;charset=utf-8',true);
  $('#dx-file',ov).addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ $('#dx-paste',ov).value=r.result; }; r.readAsText(f); });
  const parse=()=>{
    const err=$('#dx-err',ov); err.hidden=true;
    let p; try{ p=JSON.parse($('#dx-paste',ov).value); }catch(e){ err.hidden=false; err.textContent='That text isn\'t valid JSON. Choose a backup file or paste the full JSON.'; return null; }
    const worlds=Array.isArray(p&&p.worlds)?p.worlds:(validWorld(p)?[p]:null);
    if(!worlds || !worlds.length || !worlds.every(validWorld)){ err.hidden=false; err.textContent='No worlds found. The JSON needs a calendar with months and an events list.'; return null; }
    return worlds.map(x=>cleanWorld(JSON.parse(JSON.stringify(x))));
  };
  $('#dx-add',ov).onclick=()=>{ const ws=parse(); if(!ws) return; closeModal(); commit(()=>{ S.worlds.push(...ws); S.activeId=ws[0].id; ui$.selected=null; ui$.month=null; }); toast(`Imported ${ws.length} world${ws.length>1?'s':''}`); };
  $('#dx-replace',ov).onclick=e=>{ const ws=parse(); if(!ws) return; armDelete(e.currentTarget,()=>{ closeModal(); commit(()=>{ S.worlds=ws; S.activeId=ws[0].id; ui$.selected=null; ui$.month=null; }); toast('Data replaced. Undo with Ctrl+Z'); }); };
}

/* toast */
let toastT=null;
function toast(msg){ let t=$('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2400); }

/* ---------- wiring ---------- */
function renderAll(){ renderHeader(); renderFilters(); renderList(); renderDetail(); schedule(); }
const setBtn=(id,ic,label)=>{ $(id).innerHTML=ui(ic)+(label||''); };
setBtn('#now-prev','chevL'); setBtn('#now-next','chevR'); setBtn('#btn-undo','undo');
setBtn('#btn-player','eye','Player view'); setBtn('#btn-calendar','cal','Calendar'); setBtn('#btn-cats','tag','Categories');
setBtn('#btn-data','data','Data'); setBtn('#btn-add','plus','Add event');

$('#mv-prev').onclick=()=>stepMonth(-1); $('#mv-next').onclick=()=>stepMonth(1);
$('#mv-prevy').onclick=()=>stepMonth(-W().calendar.months.length); $('#mv-nexty').onclick=()=>stepMonth(W().calendar.months.length);

document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && !pop.hidden){ hidePop(); return; }
  if(e.key==='Escape' && overlay){ closeModal(); return; }
  if(overlay) return;
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName);
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !typing){ e.preventDefault(); undo(); return; }
  if(typing || e.ctrlKey || e.metaKey || e.altKey) return;
  const dm=/^(?:Digit|Numpad)([1-9])$/.exec(e.code||'');
  if(dm){ e.preventDefault(); if(e.shiftKey) saveBookmark(dm[1]); else gotoBookmark(dm[1]); return; }
  if(e.key==='Backspace'){ e.preventDefault(); goBack(); return; }
  const k=e.key, month=S.mode==='month';
  if(k==='n'||k==='N'){ e.preventDefault(); openEventEditor(null); }
  else if(k==='m'||k==='M') setMode(month?'timeline':'month');
  else if(k==='p'||k==='P') togglePlayer();
  else if(k==='.') jumpNow();
  else if(k==='Escape' && ui$.focusChar){ ui$.focusChar=null; schedule(); }
  else if(k==='Escape' && ui$.selected) select(null,false);
  else if(month){ if(k==='ArrowLeft') stepMonth(-1); else if(k==='ArrowRight') stepMonth(1); }
  else if(k==='f'||k==='F') fitAll(false);
  else if(k==='+'||k==='=') zoomAt(1.5,tl.clientWidth/2);
  else if(k==='-'||k==='_') zoomAt(1/1.5,tl.clientWidth/2);
  else if(k==='ArrowLeft'){ const v=W().view; v.start-=tl.clientWidth*0.15/v.ppd; saveSoon(); schedule(); }
  else if(k==='ArrowRight'){ const v=W().view; v.start+=tl.clientWidth*0.15/v.ppd; saveSoon(); schedule(); }
});

S=load();
S.mode=S.mode==='month'?'month':'timeline'; S.playerView=!!S.playerView;
if(!S.worlds.some(w=>w.id===S.activeId)) S.activeId=S.worlds[0].id;
renderAll();
saveNow();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ mcache.clear(); schedule(); });
})();
